<svg xmlns="http://www.w3.org/2000/svg" id="vfs-optimal-disclosure" viewBox="0 0 640 524" width="640" height="524" role="img" aria-labelledby="vfs-optimal-disclosure-title vfs-optimal-disclosure-desc">
  <title id="vfs-optimal-disclosure-title">Tokens Used vs. Tokens Needed</title>
  <desc id="vfs-optimal-disclosure-desc">A chart of tokens used against tokens needed to solve a problem. The diagonal line, where tokens used equals tokens needed, is the line of optimal disclosure. Above the line cost is high because more tokens were used than the problem needed. Below the line performance is low because fewer tokens were used than the problem needed.</desc>
  <style>
    /* Each rule names this figure, so the file can be placed inline in a page and touch nothing else. */
    /* Each colour and the typeface is the page's token when there is one, and the value here when alone. */
    #vfs-optimal-disclosure text { font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif); }
    #vfs-optimal-disclosure .primary { fill: var(--foreground, #0b0f17); }
    #vfs-optimal-disclosure .secondary { fill: var(--muted-foreground, #505661); }
    #vfs-optimal-disclosure .axis { stroke: var(--input, #857e70); fill: none; }
    #vfs-optimal-disclosure .optimal { stroke: var(--primary, #2d48d4); fill: none; }
    #vfs-optimal-disclosure .title { font-size: 20px; font-weight: 600; }
    #vfs-optimal-disclosure .head { font-size: 16px; font-weight: 600; }
    #vfs-optimal-disclosure .body { font-size: 13px; }
    #vfs-optimal-disclosure .label { font-size: 13px; font-weight: 600; }
    #vfs-optimal-disclosure .axis-title { font-size: 15px; }
    /* The background is transparent, so the ink follows the reader's theme. */
    @media (prefers-color-scheme: dark) {
      #vfs-optimal-disclosure .primary { fill: var(--foreground, #f3f0e8); }
      #vfs-optimal-disclosure .secondary { fill: var(--muted-foreground, #a39d90); }
      #vfs-optimal-disclosure .axis { stroke: var(--input, #7a7366); }
      #vfs-optimal-disclosure .optimal { stroke: var(--primary, #93b0ff); }
    }
  </style>

  <text class="title primary" text-anchor="middle" x="320" y="44">Tokens Used vs. Tokens Needed</text>

  <!-- Axes: the plot is the square from (130, 84) to (510, 464). -->
  <path class="axis" stroke-width="1" d="M130 84 V464 H510"/>

  <!-- The line of optimal disclosure: tokens used equals tokens needed. -->
  <path class="optimal" stroke-width="2" stroke-linecap="round" d="M130 464 L510 84"/>
  <text class="label primary" text-anchor="middle" transform="translate(320 274) rotate(-45)" y="-10">Line of optimal disclosure</text>

  <!-- Above the line. -->
  <text class="head primary" x="152" y="122">High cost</text>
  <text class="body secondary" x="152" y="144">More tokens used</text>
  <text class="body secondary" x="152" y="162">than the problem needed</text>

  <!-- Below the line. -->
  <text class="head primary" text-anchor="end" x="488" y="408">Low performance</text>
  <text class="body secondary" text-anchor="end" x="488" y="430">Fewer tokens used</text>
  <text class="body secondary" text-anchor="end" x="488" y="448">than the problem needed</text>

  <!-- Axis titles. -->
  <text class="axis-title secondary" text-anchor="middle" x="320" y="497">Tokens needed to solve the problem →</text>
  <text class="axis-title secondary" text-anchor="middle" transform="translate(102 274) rotate(-90)">Tokens used to solve the problem →</text>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pre-paint theme apply: mirrors theme-provider key/resolution to avoid FOUC.
      try {
        var t = localStorage.getItem("theme");
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Agentic search over any SQL database you already have — mount it as one namespace your LLM already knows how to drive, from the command line or inside your app."
    />
    <meta name="theme-color" content="#f1f1ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)" />
    <title>vfs: Agentic Search on any SQL Database</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

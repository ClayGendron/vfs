# The new docs site, built from documentation/. mkdocs.yml still builds the published site from docs/.
# Preview it with: mkdocs serve -f mkdocs-documentation.yml
site_name: VFS
site_description: Governed data access for AI agents.
site_url: https://claygendron.github.io/vfs/
repo_url: https://github.com/ClayGendron/vfs
repo_name: GitHub

docs_dir: documentation

# The look is the Pluto Systems design system: its tokens in the stylesheet, its shell in overrides/.
theme:
  name: material
  custom_dir: overrides
  features:
    # Each top-level entry of the nav is a link in the header, and the sidebar shows that entry's pages.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  # One scheme and no toggle: the stylesheet follows the reader's system theme, as the diagrams do.
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false

extra_css:
  - stylesheets/theme.css

# Diagrams are placed inline, so they follow the page's theme in every browser.
hooks:
  - overrides/inline_svg.py

# The footer prints the commit a build was made from, when CI names one.
extra:
  commit: !ENV [GITHUB_SHA, ""]

nav:
  - Home:
    - Introduction: index.md
    - Get Started: get-started.md
    - Overview: overview.md
    - History: history.md
  - Tutorials:
    - Build Your First File System: tutorials/build-your-first-file-system.md
    - Use the CLI: tutorials/use-the-cli.md
    - Keep Your Files in a Database: tutorials/keep-your-files-in-a-database.md
    - Give an AI Agent the File System: tutorials/give-an-ai-agent-the-file-system.md
    - Control Who Can Access Files: tutorials/control-who-can-access-files.md
  - How-to Guides:
    - Load a Folder of Files: how-to/load-a-folder-of-files.md
  - Reference:
    - Access Levels: reference/access-levels.md
  - Explanation:
    - Why VFS Stores Files in a Database: explanation/why-vfs-stores-files-in-a-database.md

# A page left out of the nav, or a link or anchor that leads nowhere, fails a strict build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

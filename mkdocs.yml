site_name: vfs
site_description: The virtual file system for agents.
site_url: https://claygendron.github.io/vfs/
repo_url: https://github.com/ClayGendron/vfs
repo_name: ClayGendron/vfs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: home.md
  - Tutorials:
    - Get started: tutorials/getting-started.md
  - How-to guides:
    - Overview: how-to/index.md
    - Provision Postgres search: how-to/provision-postgres-search.md
    - Add a backend: how-to/add-a-backend.md
    - Expose over MCP: how-to/expose-over-mcp.md
    - Run calls as a principal: how-to/run-calls-as-a-principal.md
    - Bulk load as the system actor: how-to/bulk-load-as-the-system-actor.md
  - Reference:
    - API: reference/api.md
    - Authority and Principal: reference/authority.md
    - Session: reference/session.md
    - Glossary: reference/glossary.md
    - Glob patterns: reference/glob-patterns.md
    - Metadata path format: reference/metadata-paths.md
    - Query engine: reference/query-engine.md
  - Explanation:
    - Architecture: explanation/architecture.md
    - The glob language: explanation/glob-language.md
    - Why database-backed: explanation/why-database-backed.md
    - Filesystem internals: explanation/filesystem-internals.md
    - Identity is a value, not a session: explanation/identity-is-a-value.md
    - Ownership is a floor, attribution is a record: explanation/ownership-and-attribution.md
    - Open in process, loud at the edge: explanation/open-in-process-loud-at-the-edge.md
    - VFS does not authenticate: explanation/vfs-does-not-authenticate.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

exclude_docs: |
  conftest.py
  __pycache__/

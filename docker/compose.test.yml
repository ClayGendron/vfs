# The real Postgres server for the storage conformance suite.
#
#   docker compose -f docker/compose.test.yml up -d --wait                                     # Postgres 17
#   VFS_PG_IMAGE=pgvector/pgvector:pg18 VFS_PG_DATA=/var/lib/postgresql \
#     docker compose -f docker/compose.test.yml up -d --wait                                   # Postgres 18
#
# The service carries a healthcheck so `--wait` blocks until the server
# accepts queries, not merely until the container runs. CI uses this
# same file (.github/workflows/test-dialects.yml), so the image, env and
# health probe stay identical between a laptop and a runner.
#
# The host port is offset (5432 + a leading digit) so the container
# never collides with a Homebrew/Postgres.app/local install already
# holding the default port.

name: vfs-test

services:
  postgres:
    # The pgvector image is a superset of the plain postgres image, which
    # cannot CREATE EXTENSION vector, which the native vector column needs.
    image: ${VFS_PG_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_USER: vfs
      POSTGRES_PASSWORD: vfs
      POSTGRES_DB: vfs
    ports:
      - "54320:5432"
    # Disposable test data; tmpfs skips disk I/O and leaves nothing behind.
    # From 18 the image keeps its data under /var/lib/postgresql/18/docker.
    tmpfs:
      - ${VFS_PG_DATA:-/var/lib/postgresql/data}
    # Installs pgvector once at first start: vfs proves the extension, never creates it.
    volumes:
      - ./initdb/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfs -d vfs"]
      interval: 2s
      timeout: 3s
      retries: 15

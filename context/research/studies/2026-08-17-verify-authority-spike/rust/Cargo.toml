[package]
name = "verify-spike"
version = "0.1.0"
edition = "2021"

# Standalone spike binary — deliberately outside the repo workspace.
[workspace]

[dependencies]
regex = "1"
memchr = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false

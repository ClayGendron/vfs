; How import-linter would express the two contracts the stdlib test holds.
; Items on one layer line joined by ":" share a layer and may import each other; "|" would make them independent.
; Not part of the vfs gate: written for the study and run once with
; `PYTHONPATH=src uvx --from import-linter lint-imports --config <this file> --no-cache`.
[importlinter]
root_package = vfs
exclude_type_checking_imports = True

[importlinter:contract:database-adapter-is-protected]
name = Only the backends package imports the database adapter
type = protected
protected_modules =
    vfs.storage.backends.database
allowed_importers =
    vfs.storage.backends

[importlinter:contract:layers]
name = The declared layer order, top first
type = layers
layers =
    vfs.session : vfs.sync
    vfs.base
    vfs.storage.backends.database
    vfs.storage.protocol
    vfs.pattern_matching
    vfs.paths : vfs.models : vfs.results : vfs.native

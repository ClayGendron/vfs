[package]
name = "vfs_kernels_rs"
version = "0.1.0"
edition = "2021"
description = "Throwaway pyo3 kernels for the 2026-08-27 numpy-replacement study (not shipped)"

# Standalone: not a member of the repo's workspace.
[workspace]

[lib]
name = "vfs_kernels_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[profile.release]
lto = true
codegen-units = 1

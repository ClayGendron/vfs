<script type="application/json" id="pages-data">{"pages": [{"id": "README", "file": "README.md", "title": "Start here", "markdown": "# /context/architecture\n\nThe map of the system: how the pieces of vfs fit together, what each\nis called, and which decision put it there. One diagram per page, each\nwith the terms it introduces defined on the same page, and one\nconsolidated [glossary](glossary.md).\n\nThese pages are drawn **from** the decisions and the code; they decide\nnothing. When a diagram and an ADR disagree, the ADR wins and the\ndiagram is wrong. When a diagram and the code disagree, read\n`context/README.md`: fix the code unless the context is demonstrably\nwrong. The diagrams exist so a spec author, a reviewer or a new\ncontributor can see the whole before touching a part.\n\n## The pages\n\n| Page | What it shows |\n|---|---|\n| [01 vfs at a glance](01-vfs-at-a-glance.md) | Who calls vfs, the fronts, the kernel, the engines and libraries beneath. The one-page picture. |\n| [02 The kernel and the facets](02-the-kernel-and-the-facets.md) | ADR 087's layering rule: the gate and everything under it is the kernel; fronts and derived verbs are facets. The four kernel groups and their verbs. |\n| [03 The source tree as layers](03-the-source-tree-as-layers.md) | Every module under `src/vfs/` and the Rust crate, placed in its layer, one line each. |\n| [04 One call, end to end](04-one-call-end-to-end.md) | The sequence from a caller's `read` to the `Result`: the gate's two halves, the funnel, the statement, the rebase. A write's extra steps. The three trust tiers. |\n| [05 The namespace and mounts](05-the-namespace-and-mounts.md) | One rooted tree, the mount table, longest-prefix resolution, the reserved `/.vfs` scope, fan-out across mounts. |\n| [06 The data model](06-the-data-model.md) | `Entry`, `Observation`, `Result`; the entry-scoped models; the 22 tables of one mount grouped by what they hold. |\n| [07 The write path](07-the-write-path.md) | Plan then execute: the snapshot, the write gate, the pinned statement order, the commit, and what is left for `reindex`. |\n| [08 Indexes and search](08-indexes-and-search.md) | `reindex`'s phases; how `grep`, `glean` and `graph` answer over the indexes plus the dirty overlay; where the Rust kernels run. |\n| [09 Identity and rights](09-identity-and-rights.md) | `Authority`, the ladder, grant and posture rows, the compile into every statement, the three places a refusal comes from. |\n| [10 History, trash and the atomic unit](10-history-trash-and-the-atomic-unit.md) | The life of a row, the two atomicity models, the serialized verbs, the fault model, the three probes and the specs that close them. |\n| [11 The agent shell, programs and the fronts](11-the-agent-shell-programs-and-the-fronts.md) | Planned: the parser, the program table, the pipe, the views, the MCP adapter, the Python guest. |\n| [Glossary](glossary.md) | Every term from every page, alphabetical, each pointing at the page that draws it. |\n\n## Viewing the pages\n\nThree ways, from least to most interactive.\n\n1. **On GitHub.** Open any page; GitHub draws the Mermaid in place.\n2. **The viewer, from disk.** Open `index.html` in a browser. It is one\n   self-contained file: every page, a sidebar, light and dark, and every\n   diagram with pan, zoom and a full-screen mode. Drag to pan; pinch or\n   hold ctrl and scroll to zoom; double-click to fit; press Escape to\n   leave full screen. Opened from disk it shows the snapshot it was\n   built from (the header says which commit).\n3. **The viewer, live.** Serve this directory and the viewer re-reads\n   the `.md` files on every load, so edits show without a rebuild:\n\n   ```bash\n   uv run python -m http.server 8765 --directory context/architecture\n   ```\n\n   then open <http://localhost:8765/>.\n\n`index.html` is generated by `build_html.py` and committed so the file\nworks without a build step. After editing a page, rebuild it:\n\n```bash\nuv run python context/architecture/build_html.py\n```\n\nThe renderers (marked, Mermaid) load from a CDN, so the viewer needs a\nnetwork connection the first time; the page text itself is local.\n\n## How to read a page\n\nEvery page has the same shape, so a reader can skim one and know the\nothers.\n\n1. A status line: when it was drawn, against which commit, and whether\n   it draws the code as it is or a decided target.\n2. The picture, in Mermaid. GitHub renders it in place; so do most\n   editors with a Mermaid preview.\n3. *Reading the picture*: short sentences, one idea each, the key idea\n   said more than once.\n4. *Terms this diagram introduces*: a table. A term is defined on the\n   first page that needs it and listed again in the glossary.\n5. *What is planned, and where*: the spec or ADR that decides each\n   planned element.\n6. *Open*: the questions the page cannot answer, pointing at\n   `open-questions.md` or an ADR's *Pending Clay* list.\n\n## The legend\n\n- A **solid** box is built and on `main` at the commit the status line\n  names.\n- A **dashed** box is planned. It names the spec or ADR that decides it.\n- A **dotted** box is built but retiring.\n- A verb in *italics* inside a group is a planned addition to that\n  group.\n\n## Keeping the map true\n\n- These pages are **revised in place**, unlike research memos and ADRs.\n  Move the date on the status line when you do.\n- When a spec lands, update the pages its *What is planned* sections\n  name: the box turns solid, the spec reference moves to *Sources*.\n- When an ADR is accepted or superseded, re-read the pages that cite\n  it.\n- Add a page when a new subsystem earns one, and a row to the table\n  above. Keep one subject per page; prefer a new page over a longer\n  one.\n- Every term in a *Terms* table goes into `glossary.md` with a pointer\n  back. The glossary is the one alphabetical index; the pages are where\n  the terms are explained in context.\n- Mermaid is checked by rendering. A page that does not render on\n  GitHub is broken; fix the diagram, not the renderer.\n- After editing any page, rebuild `index.html` with `build_html.py` so\n  the committed snapshot matches the Markdown.\n\n## Where this sits in the pipeline\n\n`research → decide → specify → code`, all under `standards/`. The\narchitecture pages sit beside `standards/` as a reading aid: they are\nnot a stage, they commit us to nothing, and they are only as true as\nthe decisions and the code they draw. A spec author starts here to\nfind the diagram the spec will change, and ends here by changing it.\n"}, {"id": "01-vfs-at-a-glance", "file": "01-vfs-at-a-glance.md", "title": "01. vfs at a glance", "markdown": "# 01. vfs at a glance\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n  Revised in place; the date above moves when it is.\n- **Shows:** who calls vfs, the fronts they call through, the kernel\n  every call passes, and the engines and libraries beneath it. One\n  picture of the whole system, built and planned on one page.\n- **Legend:** a solid box is built and on `main`. A dashed box is\n  planned, and names the spec or ADR that decides it. A box with a\n  dotted border is built but slated to change.\n- **Sources:** `src/vfs/base.py`, `src/vfs/storage/`,\n  `crates/vfs-core/src/lib.rs`; ADR 057 (one engine), ADR 058 and 075\n  (positioning), ADR 087 (the kernel); specs 167, 169, 171, 172.\n\n## The picture\n\n```mermaid\nflowchart TB\n  subgraph callers[\"Who calls vfs\"]\n    direction LR\n    agent[\"AI agent<br/>read, edit, write and search loops<br/>small batches, many at once\"]\n    etl[\"ETL developer or pipeline<br/>bulk ingest and transform<br/>10,000 rows in one call\"]\n    host[\"Host application<br/>mounts storage, sets posture,<br/>grants, runs reindex\"]\n  end\n\n  subgraph fronts[\"Fronts: facets over the kernel, no stored facts of their own\"]\n    direction LR\n    py[\"Python API<br/>VirtualFileSystem and Session\"]\n    mcp[\"MCP server: serve()<br/>verbs as tools plus one cli tool<br/>spec 171, ADR 085\"]\n    sh[\"The shell: cli meta-verb<br/>bash-shaped parser, pipes, programs<br/>specs 167 to 170, ADRs 081 to 084\"]\n    wasi[\"WASI mount provider<br/>guest file calls and a verb door<br/>specs 169b and 172, ADR 086\"]\n  end\n\n  subgraph kernel[\"The kernel (ADR 087)\"]\n    gate[\"The gate<br/>parameters, resolve, capability,<br/>reserved grammar, permission layers\"]\n    groups[\"Kernel operations in four groups<br/>filesystem core, query, history, rights\"]\n    seam[\"Storage seam<br/>StorageBackend protocols, capabilities(), traits()\"]\n    backend[\"DatabaseStorage<br/>one mount's 22 tables over SQLAlchemy Core<br/>rights compiled into every statement\"]\n  end\n\n  rust[\"Rust engine: crates/vfs-core<br/>trigrams, postings, grep matcher, chunker,<br/>markdown links, BM25, cosine top-k, centrality\"]\n  engines[\"SQL engines<br/>SQLite (dev default), Postgres, SQL Server,<br/>Oracle, MariaDB, and a generic floor\"]\n  embed[\"Embedding providers<br/>hashing floor, model2vec, OpenAI, LangChain\"]\n  renderers[\"Renderers for bytes bodies<br/>pdf, docx, pptx, xlsx\"]\n  guest[\"wasi-python guest<br/>CPython on WebAssembly with numpy and pandas<br/>a separate project, consumed as a wheel\"]\n\n  agent --> mcp\n  agent --> sh\n  agent --> py\n  etl --> py\n  host --> py\n  mcp --> py\n  sh --> py\n  wasi --> py\n  guest -.-> wasi\n  py --> gate --> groups --> seam --> backend\n  backend --> engines\n  backend --> rust\n  backend --> embed\n  backend --> renderers\n\n  classDef planned stroke-dasharray: 6 4,stroke-width:2px;\n  class mcp,sh,wasi,guest planned\n```\n\n## Reading the picture\n\nvfs is a filesystem whose files live in a SQL database. Two audiences\nshare it. Agents make many small calls and care about latency. ETL\npipelines make few large calls and care about batch size. Both reach\nthe same kernel.\n\nEvery front is a thin adapter. The Python API is the one front that is\nbuilt today. The MCP server, the shell and the WASI mount are planned;\neach will call the same router methods the Python API exposes, so every\ncall passes the same gate. A front adds only its own machinery, such as\na flag grammar, a wire format, or a handle table. It never stores a\nfact.\n\nThe kernel is the gate and everything under it. The gate is the one\nfunnel in the router. Under it sit the kernel operations, the storage\nseam, and the one storage implementation, `DatabaseStorage`. The\ndatabase holds every fact: rows, bodies, versions, edges, indexes,\ngrants.\n\nThree things sit beside the database. The Rust engine does the\ncompute-heavy work (index building, matching, scoring, chunking) and\nholds no policy. Embedding providers fill vectors during `reindex`.\nRenderers turn binary bodies into searchable text during `reindex`.\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Front** | A way into vfs built on top of the kernel: the Python API, the MCP server, the shell, a mount for a guest. A front adds its own machinery and stores no fact. ADR 087 calls fronts and derived verbs together *facets*. |\n| **Kernel** | The gate and everything under it: the router's funnel, the kernel operations, the storage seam, and storage itself. Defined in ADR 087. |\n| **Gate** | The one funnel every call passes. It has two halves: the router's (parameters, routing, capability, grammar, structural permission maps) and storage's (the caller's grants, judged inside each SQL statement). See diagram 04. |\n| **Storage seam** | The protocol in `storage/protocol.py` that the router calls. A backend declares what it serves through `capabilities()`. |\n| **Mount** | One storage backend bound at one path in the namespace. See diagram 05. |\n| **Rust engine** | The compiled crate `vfs-core`, built into the wheel as `vfs._native`. Required: there is no pure-Python fallback (ADR 057). |\n| **Generic floor** | The conservative dialect profile an unknown SQL engine resolves to. It serves the core verbs and withholds `glean` and `graph` (ADR 059). |\n\n## What is planned, and where it is decided\n\n- **The MCP server** (`vfs.mcp`, spec 171): every kernel verb as a\n  tool, plus one `cli` tool; rows projected to MCP's five content\n  blocks (ADR 085); a token in and an `Authority` out (spec 149).\n- **The shell** (`src/vfs/shell/`, spec 167): a static bash-shaped\n  parser (ADR 081), a program table (ADR 082), a pipe of rows or bytes\n  (ADR 083), the gate order as the execution policy (ADR 084).\n- **The WASI mount** (specs 169b, 172): the guest's whole filesystem\n  is a vfs `Session`; wasi-python 0.1.0 already ships the mount and\n  tool protocols the seam needs (memo 2026-10-23).\n\n## Open\n\n- Which front comes first after WASI: FUSE or NFS (kernel memo\n  2026-10-23, Q5).\n"}, {"id": "02-the-kernel-and-the-facets", "file": "02-the-kernel-and-the-facets.md", "title": "02. The kernel and the facets", "markdown": "# 02. The kernel and the facets\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n  Draws ADR 087 (proposed 2026-10-24) as the target shape and marks\n  what the code already is.\n- **Shows:** the one layering rule vfs now follows. The kernel is the\n  gate and everything under it. Everything else is a facet: a front\n  or a derived verb. The four groups of kernel operations and the\n  verbs in each.\n- **Legend:** solid is built. Dashed is planned, with the spec named.\n  Verbs in *italics* inside a group are planned additions.\n- **Sources:** ADR 087 pins 1, 2, 4, 5; spec 179 (the seam regrouped),\n  spec 181 (the public surface regrouped); `src/vfs/ops.py`,\n  `src/vfs/base.py`, `src/vfs/storage/protocol.py`.\n\n## The picture\n\n```mermaid\nflowchart TB\n  subgraph facets[\"FACETS: built from kernel calls, store no fact of their own\"]\n    direction LR\n    subgraph fronts[\"Fronts\"]\n      direction TB\n      f1[\"Python API<br/>VirtualFileSystem, Session\"]\n      f2[\"MCP tool surface<br/>spec 171\"]\n      f3[\"Shell: cli, programs, pipes<br/>specs 167 to 170\"]\n      f4[\"WASI mount provider<br/>specs 169b, 172\"]\n      f5[\"FUSE or NFS mount<br/>future\"]\n    end\n    subgraph derived[\"Derived verbs\"]\n      direction TB\n      d1[\"tree<br/>= ls repeated\"]\n      d2[\"edit<br/>= read + guarded write\"]\n      d3[\"rmdir<br/>= delete without cascade\"]\n    end\n  end\n\n  subgraph kernel[\"THE KERNEL: the gate and everything under it\"]\n    subgraph gate[\"The gate, two halves\"]\n      direction LR\n      g1[\"Router half (base.py)<br/>_gate_params → resolve → _gate_entry<br/>capability → reserved grammar → permission maps<br/>→ _dispatch_entry → _call_storage\"]\n      g2[\"Storage half (rights.py)<br/>resolve_authority → Visibility or WriteGate<br/>→ the caller's rights inside every statement\"]\n    end\n    subgraph groups[\"Four kernel groups (22 verbs)\"]\n      direction TB\n      k1[\"Filesystem core (8)<br/>stat, ls, read, write,<br/>mkdir, delete, move, copy\"]\n      k2[\"Query (6)<br/>glob, grep, glean, graph,<br/>mkedge, rmedge\"]\n      k3[\"History (2 + planned)<br/>restore, sweep,<br/>versions, scrub (specs 180, 175)\"]\n      k4[\"Rights (6)<br/>grant, revoke, grants, posture,<br/>add_member, remove_member\"]\n      k1 ~~~ k3\n      k2 ~~~ k4\n    end\n    seam[\"Storage seam: protocol.py<br/>today: SupportsRead, SupportsMutation, SupportsPatternSearch,<br/>SupportsGlean, SupportsGraph, SupportsGrants, SupportsRun<br/>planned (spec 179): regrouped by kernel group, plus features() and traits()\"]\n    backend[\"DatabaseStorage over SQLAlchemy Core, plus the Rust engine\"]\n  end\n\n  fronts --> gate\n  derived --> gate\n  gate --> groups --> seam --> backend\n\n  classDef planned stroke-dasharray: 6 4,stroke-width:2px;\n  class f2,f3,f4,f5 planned\n```\n\n## Reading the picture\n\nStart at the bottom. The database holds every fact. Storage reads and\nwrites it through one protocol, the storage seam. The router calls the\nseam through one funnel, the gate. The kernel is that whole stack: the\ngate and everything under it.\n\nThe kernel has four groups of operations. The filesystem core is the\npart every file protocol has. The query group is the part no file\nprotocol has: search over an index, with the caller's rights compiled\ninto the search statement. The history group reads and writes version\nand tombstone facts. The rights group reads and writes grant facts.\nAll four pass the same gate. That is why they are kernel operations and\nnot a layer above.\n\nEverything above the gate is a facet. A front is a way in. A derived\nverb is a convenience built from kernel calls. Neither stores a fact.\n`tree` is `ls` repeated. `edit` is `read` followed by a guarded\n`write`. A facet may add its own machinery: a parser, a handle table, a\nwire format, a line window. It may not add a stored fact or a new\npermission check.\n\nThe gate has two halves, and a front that skipped either would skip\nthe gate. The router's half judges what the router knows: the\nparameter table, the mount table, the capability set, the reserved\ngrammar, the structural permission maps. Storage's half judges what\nonly the rows know: the caller's grants, compiled into the statement.\n\n## Today versus the target\n\n| Piece | Today (`ba77449`) | Target (ADR 087 and its specs) |\n|---|---|---|\n| Verb set | 25 routed verbs in `ALL_OPS`, including `run` | 24: `run` retires (ADR 082 pin 12, spec 167 slice A). 22 sit in the four kernel groups; `tree` and `edit` are the derived verbs. ADR 087 pin 1 writes the rights group's last member as `members`; the code has `add_member` and `remove_member`, and spec 181 keeps the two |\n| Dispatch classes | `MUTATING_OPS`, `TWO_PATH_OPS`, `READ_OPS`, `EXEC_OPS`, `GRANT_OPS` (and `DEVELOPER_OPS`, a plane marker: never on an agent-facing surface) | The same classes stay as the routing axis; kernel groups are a second axis, `OpGroup` in `ops.py` (spec 181) |\n| Seam families | Grouped by history: `SupportsRead` (the minimum: read, stat, ls, tree), `SupportsMutation`, `SupportsPatternSearch`, `SupportsGlean`, `SupportsGraph`, `SupportsRun`, `SupportsGrants`, plus `SupportsTraits`, `SupportsReindex`, `SupportsClose` | Grouped by kernel group: `SupportsFileRead`, `SupportsFileWrite`, `SupportsCopy`, `SupportsTree`, `SupportsEdit`, `SupportsPatternSearch`, `SupportsGlean`, `SupportsGraph`, `SupportsEdges`, `SupportsTrash`, `SupportsRights`; a backend lacking a derivable piece is served by the kernel, slower (spec 179) |\n| Per-call arguments | Whole bodies, whole listings, no preconditions | `ls(after=, limit=)`, `read(range=)`, `write(if_version=, if_absent=, append=)`, `move(replace=)` (specs 174, 176, 178, 167) |\n| Public names | Flat: `vfs.read`, `vfs.grep` | Flat, by lean (pin 16); groups are documentation and test organisation, not namespaces |\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Facet** | Anything built on top of kernel calls that stores no fact of its own. Two kinds: fronts and derived verbs. |\n| **Derived verb** | A verb built from kernel calls: `tree`, `edit`, `rmdir`. A backend may answer one natively; otherwise the kernel derives it. |\n| **Kernel group** | One of four kinds of kernel operation: filesystem core, query, history, rights. Spec 181's `OpGroup` adds a fifth value, `derived`, so `tree` and `edit` have a home in the one list. |\n| **Dispatch class** | How a verb is routed and gated: mutating, two-path, read, exec, grant. A different axis from the group. `mkedge` is in the query group and is a mutation. |\n| **Capability** | An operation a backend declares in `capabilities()`. \"Which verbs.\" |\n| **Trait** | A quality of how a backend serves, from `traits()`: today the grep tier, the glean staleness, the arbitration mode; a durability tier is planned (spec 179). \"How.\" |\n| **Feature** | Planned (spec 179). An argument family or index a backend serves itself, from `features()`. \"Which arguments.\" |\n| **Derive** | Planned (spec 179). The kernel serves something the backend lacks from simpler calls the backend has. Correct, slower. |\n\n## Not in the kernel, by evidence (ADR 087 pin 4)\n\nNo handles or file descriptors (a front owns its own handle table).\nNo inode-keyed addressing (`entry_id` becomes a read-only column on\n`stat`, never an address). No hard or symbolic links. No mode bits or\n`chmod`. No access time. No `fsync` verb. No seek (a byte range per\ncall instead).\n\n## Open\n\n- Pin 3: keep `delete` and `move` as names, or rename to `remove` and\n  `rename`.\n- Pin 16: flat names, or groups as namespaces.\n- Pin 17: on `move(replace=True)`, which row's identity survives.\n"}, {"id": "03-the-source-tree-as-layers", "file": "03-the-source-tree-as-layers.md", "title": "03. The source tree as layers", "markdown": "# 03. The source tree as layers\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n- **Shows:** every module under `src/vfs/` and the Rust crate, placed\n  in the layer it serves, with one line on what each owns. This is\n  the map from the design words to the files.\n- **Legend:** boxes are modules or packages. Arrows point from a\n  module to what it imports, at the layer level only. Planned\n  packages are dashed.\n- **Sources:** the module docstrings under `src/vfs/`;\n  `crates/vfs-core/src/lib.rs`; spec 167 (`shell/`), spec 171 (`mcp/`),\n  spec 181 (`derived.py`, `chain.py`).\n\n## The picture\n\n```mermaid\nflowchart TB\n  subgraph surface[\"Public surface and fronts\"]\n    direction LR\n    init[\"__init__.py<br/>the exported names\"]\n    session[\"session.py<br/>Session: one authority, one filesystem\"]\n    shell[\"shell/ (planned, spec 167)<br/>parse, programs, run, cli\"]\n    mcp[\"mcp/ (planned, spec 171)<br/>serve, adapter, schemas\"]\n    skills[\"skills.py<br/>Agent Skills as entries under /.agents\"]\n  end\n\n  subgraph router[\"The router and its vocabulary\"]\n    direction LR\n    base[\"base.py<br/>VirtualFileSystem: mount table, the gate,<br/>the funnel, fan-out, cross-mount routing\"]\n    ops[\"ops.py<br/>Op names, dispatch classes, the ladder, VERB_RUNGS\"]\n    params[\"params.py<br/>the per-op parameter table\"]\n    paths[\"paths.py<br/>Path: canonical paths, the reserved scope\"]\n    authority[\"authority.py<br/>Principal, Authority, the four doors\"]\n    permissions[\"permissions.py<br/>PermissionMap: structural read-only layers\"]\n    rerank[\"rerank.py<br/>cross-mount merge of glean answers\"]\n    exceptions[\"exceptions.py<br/>the opt-in raise at the boundary\"]\n  end\n\n  subgraph models[\"Domain models and results\"]\n    direction LR\n    entry[\"models/entry.py<br/>Entry, Observation, Match\"]\n    scoped[\"models/chunk.py, version.py, edge.py<br/>entry-scoped metadata\"]\n    rows[\"models/rows.py<br/>the 22 tables, hand-written\"]\n    media[\"models/media.py<br/>text or bytes, render status, mime\"]\n    support[\"models/chunking.py, code_grams.py, lexical.py, postings.py,<br/>links.py, signals.py, versioning.py,<br/>vector.py, vector_codec.py, vector_native.py\"]\n    results[\"results/<br/>envelope.py Result, kinds.py ErrorKind,<br/>render.py, projection.py, preview.py\"]\n    pm[\"pattern_matching/<br/>glob.py the pattern language,<br/>grep.py the match authority\"]\n  end\n\n  subgraph storage[\"Storage: the seam and the one backend\"]\n    direction LR\n    protocol[\"storage/protocol.py<br/>the Supports* families, StorageBackend\"]\n    shared[\"storage/grants.py rights algebra,<br/>ranking.py fusion, replace.py and editing.py the edit engine\"]\n    backend[\"storage/backends/database/<br/>backend.py DatabaseStorage and 31 modules<br/>(see the table below)\"]\n    memory[\"storage/backends/memory.py<br/>InMemoryStorage = DatabaseStorage on SQLite :memory:\"]\n  end\n\n  subgraph seams[\"Seams to the outside\"]\n    direction LR\n    native[\"native.py<br/>the Rust engine, protocol-gated\"]\n    embedding[\"embedding/<br/>provider seam; hashing, model2vec, openai, langchain\"]\n    rendering[\"rendering/<br/>seam, registry, the markdown builder;<br/>pdf, docx, pptx, xlsx\"]\n  end\n\n  rust[\"crates/vfs-core (Rust)<br/>grams, postings, verify, chunk, links,<br/>lexical and its generated tables, vectors, signals;<br/>python.rs binding\"]\n\n  surface --> router --> models\n  router --> storage\n  storage --> models\n  storage --> seams\n  models --> native\n  native --> rust\n\n  classDef planned stroke-dasharray: 6 4,stroke-width:2px;\n  class shell,mcp planned\n```\n\n## The database backend, module by module\n\n`storage/backends/database/` is the largest package. Each module owns\none concern.\n\n| Module | Owns |\n|---|---|\n| `backend.py` | `DatabaseStorage`: the protocol methods, one transaction per verb, the permission view (`_viewed`), `reindex`'s phase order |\n| `engine.py` | `EngineHost`: built or borrowed connectivity, first touch, retry, close, sqlite-vec loading |\n| `dialects.py` | `DialectProfile` per engine and the generic floor; the membership budget; `chunked()`; bulk insert modes |\n| `membership.py` | Every chunked `IN (...)`, in the dialect's form |\n| `descent.py` | Miss classification (`not_found` versus `wrong_kind`), bounded path fetches, subtree scoping |\n| `reads.py` | `stat`, `ls`, `tree`, `read`, `glob` statement builders; `Observation` reconstruction with the populated mask |\n| `writes.py`, `staging.py` | `write`, `edit`, `mkdir`: plan then execute; `WritePlan` and `StagedEntry` |\n| `versions.py` | The version mint: an overwrite keeps the replaced body as a version row |\n| `serialized.py` | The kit shared by the serialized verbs: the per-mount lock row, guarded claims, redrive |\n| `topology.py` | `move`, `copy` |\n| `trash.py` | `delete`, `restore`, `sweep` over the tombstone columns |\n| `edges.py` | The `fs` mirror edge per entry; edge drift repair |\n| `segments.py`, `pathterms.py` | Path-segment postings for glob pushdown; the glob-to-terms compiler |\n| `grep.py`, `scope.py` | Grep over the gram index plus the dirty overlay; the structural scope both grep and glean share |\n| `indexing.py`, `lexical.py` | `reindex`'s gram epochs: assess, chunk, build, publish, reclaim; the lexical index build |\n| `links.py` | Markdown references minted as `links` edges inside the chunk pass |\n| `render.py` | The render stage of `reindex`: bytes bodies to text renderings |\n| `embed.py` | The embed step of `reindex`: streaming, resumable, no transaction held |\n| `glean.py`, `distance.py` | Ranked search: the BM25 leg, the vector leg, fusion; the cosine spelling per dialect |\n| `signals.py` | Stored ranking priors computed during `reindex` |\n| `graph.py` | The frontier walk over `vfs_edges`, judged every hop |\n| `rights.py`, `ranges.py`, `labels.py`, `revision.py` | The enforcement spine: resolve and cache rights, the three-seek predicate, the everyone level on the row, the grant revision lock |\n| `offload.py` | CPU work leaves the event loop |\n| `seams.py` | Named points where tests stage rival writers |\n\n## Reading the picture\n\nThe layers import downward, with two exceptions worth knowing. The\nrouter imports the models and the storage seam, and also two concrete\npieces of the database backend: `InMemoryStorage` as the default root\nand one trash constant from `descent.py`. And `base.py` imports\n`Session` at runtime so `vfs.session()` can build one, while\n`session.py` imports the router only for typing; the runtime arrow\nbetween those two points from the router to the surface. Storage\nimports the models and the outside seams. The one leaf that everything\nmay import is `native.py`, which imports nothing else from vfs.\n\nTwo modules define vocabulary that every layer shares and neither\nlayer may redefine. `ops.py` is the verb vocabulary: the names, the\ndispatch classes, the ladder, and the rung each verb needs. `params.py`\nis the parameter vocabulary: one row per public parameter, read by\nthe router's gate, the signature drift test, and the planned wire\nschemas.\n\n`pattern_matching/` is pure. Paths and text go in; decisions come out.\nIt knows nothing about rows, sessions or the router. Storage prefilters\nand router dispatch both defer to it.\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Router** | `VirtualFileSystem` in `base.py`. It owns the mount table and the gate, and calls storage through one funnel. One router is one namespace and one policy layer. |\n| **Domain model** | A pydantic value never bound to a database session: `Entry`, `Observation`, `Chunk`, `Version`, `Edge`. |\n| **Persistence model** | The hand-written tables in `rows.py`. Held in step with the domain models by a drift test, never derived from them. |\n| **Seam** | A declared boundary with a protocol on one side and replaceable implementations on the other: the storage seam, the embedding seam, the renderer seam, the native seam. |\n| **Offload** | Running CPU-bound work on a worker thread so the event loop keeps serving other callers. |\n\n## What is planned, and where\n\n- `shell/` (spec 167): `parse.py`, `programs/`, `run.py`, `status.py`.\n- `mcp/` (spec 171): `serve.py`, `adapter.py`, `schemas.py`, behind\n  the `vfs-py[mcp]` extra.\n- `derived.py` and `chain.py` (specs 179, 181): the derived verbs and\n  the rows-in-hand filters that leave `glob` and `grep`.\n- `src2/` and `tests2/` are archived pre-refactor code, not part of\n  this map.\n"}, {"id": "04-one-call-end-to-end", "file": "04-one-call-end-to-end.md", "title": "04. One call, end to end", "markdown": "# 04. One call, end to end\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n- **Shows:** what happens between a caller typing `read` and the\n  `Result` coming back. Every step is a named function in the code.\n  The same path serves every verb; a mutation adds the steps in the\n  second picture.\n- **Legend:** the gate's two halves are labelled. Steps marked\n  *planned* do not exist yet and name their spec.\n- **Sources:** `src/vfs/base.py` (`_route_single`, `_gate_params`,\n  `_admitted`, `_resolve_terminal`, `_gate_entry`, `_dispatch_entry`,\n  `_call_storage`), `src/vfs/storage/backends/database/rights.py`\n  (`resolve_authority`, `Visibility`, `WriteGate`), ADR 087 pin 5\n  (the two halves), ADR 067 and 072 (rights in the statement).\n\n## The picture: a read\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant C as Caller<br/>(Session or a front)\n  participant R as Router<br/>VirtualFileSystem\n  participant S as Storage<br/>DatabaseStorage (one mount)\n  participant E as SQL engine\n\n  C->>R: read(\"/docs/q2.md\", authority=alice)\n\n  rect rgb(235, 243, 255)\n    Note over R: THE GATE, router half\n    R->>R: _gate_params: the parameter table (params.py)<br/>bad shape classifies invalid before anything else\n    R->>R: resolve_path: canonical Path, reserved grammar\n    R->>R: _resolve_terminal: longest-prefix match in the mount table<br/>→ Binding(path, storage, meta) and the mount-relative path\n    R->>R: _gate_entry: capability (meta.caps) → reserved grammar (mutations only) → permission layers (writes only)\n    R->>R: _dispatch_entry → _call_storage: _admitted fills the authority<br/>(explicit, else the default, else anonymous), then the fixed match on op\n  end\n\n  R->>S: storage.read(path=rel, authority, columns)\n\n  rect rgb(255, 245, 230)\n    Note over S,E: THE GATE, storage half (inside one transaction)\n    S->>E: resolve_authority: principal stamps and relabels in flight\n    Note over S: RightsCache hit? else grants, memberships, postures → Rights\n    S->>S: Visibility at the verb's rung (VERB_RUNGS: read → read)<br/>compiles to the three-seek predicate\n    S->>E: SELECT columns FROM vfs_entries JOIN vfs_content<br/>WHERE path IN (...) AND (everyone_level ≥ r OR in the caller's ranges OR owned)\n    E-->>S: rows, or nothing (a hidden row looks absent)\n  end\n\n  S-->>R: Result(observations, errors) in mount coordinates\n  R->>R: with_mount: rebase every path and error to router coordinates\n  R->>R: _shadow_filter: drop rows under a deeper binding\n  R-->>C: Result\n```\n\n## The picture: a write adds these steps\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant R as Router\n  participant S as Storage (one mount)\n  participant E as SQL engine\n\n  Note over R: router half, as for a read, plus:\n  R->>R: _busy_guard, for delete, restore, sweep, move and copy only:<br/>the target may not be a live mount point\n  R->>R: _gate_entry with write_rels: the reserved grammar refuses /.vfs,<br/>then check_writable_composed over every PermissionMap on the path\n  R->>S: storage.write(entries=[...], authority, overwrite, parents)\n\n  rect rgb(255, 245, 230)\n    Note over S,E: one transaction, whole-batch atomic\n    S->>E: one path IN select: committed state of targets and ancestors\n    S->>S: WriteGate: the caller's rung on every target and ancestor<br/>any refusal fails the whole batch, nothing written\n    S->>S: WritePlan (staging.py): POSIX parent and site gates<br/>against committed-plus-staged state, pure Python\n    S->>E: execute in pinned order: entry inserts parents-first (chunked),<br/>guarded material updates, version mint, body replace,<br/>fs mirror edge, segment postings, everyone-level label, parent bumps\n    S->>E: COMMIT\n  end\n  S-->>R: Result with one row per entry: created, updated or unchanged\n  Note over R,S: planned: if_version and if_absent preconditions (spec 174),<br/>content_hash verified on read and returned on every written row (spec 175),<br/>a request key for replay (spec 177)\n```\n\n## Reading the picture\n\nEvery verb walks the same road. First the router checks what it can\nknow without touching storage: the parameters, the path, which mount\nowns it, whether that mount declares the verb, whether a mutation's\npath is reserved, and whether a structural read-only map forbids a\nwrite. These are the router's half of the gate. An incapable mount\nreads as `unsupported`, never as a permission denial; the order is a\ncontract. At the funnel the router fills in the authority the call\nruns as: the explicit one, else the filesystem's default, else\nanonymous.\n\nThen the router calls storage through one funnel. `_call_storage` is a\nfixed `match` on the op name ending in `assert_never`, so a new verb\nfails type checking until it is routed. Storage opens one transaction.\nInside it, storage resolves the caller's rights and compiles them into\nthe statement. A row the caller may not see is not fetched; it looks\nexactly like a row that does not exist. This is storage's half of the\ngate, and nothing above storage could do it, because only the rows\nknow who may see them.\n\nThe result comes back in mount coordinates. The router rebases every\npath to the namespace and drops rows that a deeper mount shadows. The\ncaller sees one tree.\n\nA mutation adds a write gate inside storage and a plan-then-execute\ndiscipline: fetch committed state once, adjudicate the whole batch in\nmemory, and execute only an error-free plan. A batch of 10,000 rows\nwith one bad row writes nothing.\n\n## The three trust tiers (ADR 087 pin 5)\n\n| Tier | Where | What the gate is |\n|---|---|---|\n| In process | Python API, `Session` | A convention: any caller could construct `Authority.system()` or reach the storage object. Open by default (ADR 068). |\n| On the wire | `serve()` (planned, spec 171) | A wall: a token in and an `Authority` out (ADR 062, spec 149); the system actor is refused for every served call. |\n| In the guest | WASI mount (planned, specs 169b, 172) | A wall: the guest's only exits are the file calls and the host door, both over one `Session`. |\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Funnel** | `_dispatch_entry` and `_call_storage`: the one seam from op to storage and one seam back. Every routed dispatch (single, grouped, paired, fan-out, tree) passes through it. |\n| **Admitted authority** | The authority a call runs as after `_admitted`: the explicit one, else the filesystem's default, else anonymous. Storage always receives one. |\n| **Binding** | One mount-table row: `(path, storage, meta)`. The root's own storage is the identity binding at `/`. |\n| **Permission layer** | A structural `PermissionMap` on a binding: a default of `read` or `read_write` plus prefix overrides. Layers compose downward and only tighten. Distinct from grants, which are per caller. |\n| **Visibility** | Storage's compile of one read call's rights at the verb's rung: which rows the caller may name, which it may read whole. |\n| **WriteGate** | Storage's check that a mutation passes before its first write statement: the caller's rung on every target and ancestor, decided once per batch. |\n| **Three-seek predicate** | The visibility clause: the everyone level on the row, the caller's grant ranges joined to the path index, and the rows the caller owns. Three index seeks merged by `UNION ALL`. See diagram 09. |\n| **Rebase** | Translating paths between mount coordinates and router coordinates: `with_mount` and `without_mount` on `Result`. |\n| **Shadow filter** | Dropping rows that a deeper binding owns, so a listing of `/` never shows the root storage's stale row under a mount point. |\n\n## Open\n\n- Specs 174 to 178 add preconditions, integrity, a cursor, replay and\n  ranges to this path. Each is a draft cut from ADR 087 on 2026-10-24.\n"}, {"id": "05-the-namespace-and-mounts", "file": "05-the-namespace-and-mounts.md", "title": "05. The namespace and mounts", "markdown": "# 05. The namespace and mounts\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n- **Shows:** the one rooted tree every caller sees, how a mount binds\n  a storage backend into it, how a path resolves to exactly one\n  backend, the reserved `/.vfs` scope, and how a search spanning\n  several mounts is answered.\n- **Legend:** solid is built. Dashed is planned, with the spec named.\n  Dotted is built but retiring.\n- **Sources:** `src/vfs/base.py` (the module docstring, `bind`,\n  `add_mount`, `_resolve_terminal`, `_route_fanout`, `_rank_fanout`),\n  `src/vfs/paths.py`, `src/vfs/rerank.py`; constitution Article 1;\n  ADR 001 (composition), 009 (stored mount points), 011 (no union\n  routing), 016 (metadata off the namespace), 030 (residual\n  routing), 082 pins 6 to 8 (the `/.vfs` views) and 9 (the program\n  index); spec 169a.\n\n## The picture: one tree, three storages\n\n```mermaid\nflowchart LR\n  subgraph tree[\"What every caller sees: one rooted tree\"]\n    direction LR\n    root[\"/\"]\n    docs[\"/docs\"]\n    q2[\"/docs/q2.md\"]\n    data[\"/data (mount point)\"]\n    sales[\"/data/sales.csv\"]\n    code[\"/code (mount point)\"]\n    auth[\"/code/src/auth.py\"]\n    meta[\"/.vfs (reserved meta scope)\"]\n    trash[\"/.vfs/trash<br/>the trash view, per mount\"]\n    views[\"/.vfs/bin, skills, run, tools, mcp<br/>router-owned views, specs 169 and 170\"]\n    agents[\"/.agents/tools, /.agents/skills<br/>built; retires under ADR 082\"]\n    root --> docs --> q2\n    root --> data --> sales\n    root --> code --> auth\n    root --> meta --> trash\n    meta --> views\n    root --> agents\n  end\n\n  subgraph table[\"The mount table in the router: path → Binding(path, storage, meta)\"]\n    direction TB\n    b0[\"/  → root storage (the identity binding)<br/>DatabaseStorage on Postgres\"]\n    b1[\"/data → DatabaseStorage on SQL Server<br/>meta: caps, deny_ops, permission_map read_only\"]\n    b2[\"/code → InMemoryStorage<br/>(DatabaseStorage on SQLite :memory:)\"]\n  end\n\n  root -.-> b0\n  data -.-> b1\n  code -.-> b2\n\n  classDef planned stroke-dasharray: 6 4,stroke-width:2px;\n  classDef retiring stroke-dasharray: 2 3;\n  class views planned\n  class agents retiring\n```\n\n## The picture: how a path finds its backend\n\n```mermaid\nflowchart TB\n  p[\"caller path<br/>/data/reports/2026/q2.md\"] --> n[\"resolve_path<br/>normalise, validate, canonical Path\"]\n  n --> m[\"_resolve_terminal<br/>longest prefix in the sorted mount table\"]\n  m --> hit[\"Binding at /data\"]\n  hit --> rel[\"mount-relative path<br/>/reports/2026/q2.md\"]\n  rel --> invoke[\"storage.op(rel, authority)\"]\n  invoke --> back[\"Result in mount coordinates\"]\n  back --> rebase[\"with_mount('/data')<br/>paths and errors rebased\"]\n  rebase --> shadow[\"_shadow_filter<br/>drop rows a deeper binding owns\"]\n  shadow --> out[\"Result in namespace coordinates\"]\n```\n\n## The picture: a search that spans mounts\n\n```mermaid\nflowchart TB\n  q[\"grep 'mfa' under /\"] --> plan[\"_route_fanout: which bindings can the scope reach,<br/>and which declare the verb (capability-pruned)\"]\n  plan --> a[\"root storage: grep over /docs, /.vfs excluded\"]\n  plan --> b[\"/data storage: grep over its whole tree\"]\n  plan --> c[\"/code storage: grep over its whole tree\"]\n  a --> merge[\"merge: union of rows, each rebased;<br/>a mount that refuses adds one skip error, the rest still answer\"]\n  b --> merge\n  c --> merge\n  merge --> cap[\"row cap and the Result\"]\n  cap -.-> rank[\"glean only: _rank_fanout, rerank.py<br/>one BM25 over the union of the mounts' answers,<br/>each mount's own order never changed\"]\n```\n\n## Reading the picture\n\nThere is one tree. Every first-class thing has an absolute path in it.\nThere are no parallel naming systems, no backend URLs in paths, and no\nhidden ids a caller must learn (constitution Article 1).\n\nA mount binds a storage backend at one path. The binding lives in the\nrouter's mount table, which maps a path to `Binding(path, storage,\nmeta)`. The root binding is the node's own storage. The mount-point\ndirectory itself is an ordinary stored row in whichever storage owns\nthe parent path. The shape of the namespace is stored, never\nsynthesised. A mount binds a storage instance, never another router:\none router is one namespace and one policy layer, the Linux shape.\n\nResolution is longest prefix. A path matches the deepest binding whose\npath prefixes it, and the root binding is the fallback. Every path\nresolves to exactly one backend. There is no union routing: a path\nnever falls through from one backend to another (ADR 011).\n\n`bind` is the primitive: it attaches a storage onto an existing empty\ndirectory. `add_mount` fuses a mkdir-if-absent in front of it.\n`remove_mount` unbinds and then removes the empty mount-point\ndirectory. A delete, restore, sweep, move or copy may not target a\nlive mount point: that is the busy guard, `EBUSY` in Unix terms.\n\n`/.vfs` is the reserved meta scope. Today it holds the trash view,\nwhich each backend serves at `<mount>/.vfs/trash`: a deleted row stays\nat its path with a tombstone, and the view shows the tombstoned rows\nat their own paths. Nothing may be written beneath `/.vfs`. The\nplanned catalogue views (`bin`, `skills`, `run`, `tools`, `mcp`) are\nserved by a router-owned view table checked before the mount table\n(ADR 082 pin 7, spec 169a). `/.agents` holds the skill and tool\nentries today and retires when those views land.\n\nThe verbs that take a scope rather than one path (`glob`, `grep`,\n`glean`) fan out to every binding the scope reaches and that declares\nthe verb. Each mount answers in its own coordinates; the router\nrebases and unions the answers. For `glean`, two mounts' scores are\nnot comparable, so the router re-scores the union with one BM25 built\nfrom the statistics each mount exports, under one law: a mount's own\norder is never changed.\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Namespace** | The one rooted tree. Everything first-class is addressable in it by an absolute, canonical path. |\n| **Path** | The `Path` type in `paths.py`: normalised, validated, at most 1,024 bytes, segments at most 255 bytes, no `..` after resolution. |\n| **Mount point** | A directory row stored in the parent's storage, at which a binding attaches another storage. |\n| **Mount table** | The router's sorted map from path to `Binding`. Longest prefix wins. |\n| **Identity binding** | The root binding at `/`: the node's own storage, and the fallback for every path no deeper binding claims. |\n| **Longest-prefix resolution** | Finding the deepest binding whose path prefixes the caller's path. |\n| **Mount coordinates** | Paths as a storage sees them, relative to its binding. Router coordinates are paths as the caller sees them. |\n| **Reserved scope** | `/.vfs`: the system's own tree, served as views, never written by a caller. `check_reserved_path` refuses mutations there. |\n| **Trash view** | `/.vfs/trash/<path>`: the tombstoned row at `<path>`, per mount (ADR 074). |\n| **View** | Planned. A `/.vfs` head the router serves from a table of its own, checked before the mount table: `bin`, `skills`, `run`, `tools`, `mcp`. |\n| **Fan-out** | Dispatching one scoped verb to every binding its scope reaches, in parallel, and merging the answers. |\n| **Capability-pruned** | A fan-out skips a binding that does not declare the verb, and says so with a skip error instead of failing the call. |\n| **Rerank** | The cross-mount merge of `glean` answers: one BM25 over the union, each mount contributing a prefix of its own list. |\n| **Busy guard** | The refusal of a delete, restore, sweep, move or copy that targets a live mount point or a region holding one. Unmount first. |\n\n## Open\n\n- Nested mounts are built: a deeper binding is an ordinary row in the\n  same table (roadmap item 016 is stale on this). Bind aliases and\n  union mounts are roadmap items (`standards/roadmap.md`, Wave 2).\n- Cross-mount `copy` as read plus write is spec 160 (draft).\n- Spec 176 adds a cursor to `ls`, `tree` and `glob` with one merge rule\n  for every fan-out.\n"}, {"id": "06-the-data-model", "file": "06-the-data-model.md", "title": "06. The data model: domain models and the schema", "markdown": "# 06. The data model: domain models and the schema\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`\n  (schema format 23).\n- **Shows:** the three result-side values every caller touches\n  (`Entry`, `Observation`, `Result`), the three entry-scoped models\n  (`Chunk`, `Version`, `Edge`), and the 22 tables one mount stores,\n  grouped by what they hold. `entry_id` is the spine that ties them.\n- **Legend:** solid is built. Columns listed are the ones that carry\n  the design; the full column lists are in `models/rows.py`.\n- **Sources:** `src/vfs/models/entry.py`, `rows.py`, `chunk.py`,\n  `version.py`, `edge.py`, `media.py`; `src/vfs/results/envelope.py`;\n  ADR 004 (stable identity), 010 (the envelope), 013 and 017\n  (versions), 015 (the entry, chunk, version, edge split), 018 and\n  019 (edges, ULIDs), 020 (schema format), 021 and 073 (grants on the\n  row), 074 (the tombstone).\n\n## The picture: the values a caller sees\n\n```mermaid\nclassDiagram\n  class Entry {\n    the stored file or directory\n    path : Path\n    kind : file or directory\n    content : str or None\n    data : bytes or None\n    source : text or bytes\n    content_hash, mime_type, ext\n    lines, size_bytes\n    owner_id\n    created_at, updated_at, deleted_at\n  }\n  class Observation {\n    one row an operation returned about an Entry\n    path : Path\n    kind, version\n    content, data, source, render_status\n    content_hash, mime_type, size_bytes\n    edge_type, edge_target, edge_weight, edge_distance\n    score, matches : list of Match\n    in_degree, out_degree, depth\n    status : created, updated, unchanged, deleted\n    populated : frozenset of field names\n  }\n  class Match {\n    one hit inside a body\n    start, end : line numbers\n    match, content\n    score, preview\n  }\n  class Result {\n    what every verb returns\n    ops : tuple of op names\n    observations : list of Observation\n    errors : list of ResultError\n    success : property, true iff no fatal error\n    extras : grants, rendering, embedding\n    set algebra, sort, top, filter\n    with_mount, without_mount\n    to_payload, from_payload\n  }\n  class ResultError {\n    one classified fact\n    kind : ErrorKind\n    message : composed from the kind's phrase\n    severity : error, warning, info\n    path, source, data, retryable\n  }\n  class Chunk {\n    entry-scoped: (file, chunk_index)\n    line_start, line_end, content\n  }\n  class Version {\n    entry-scoped: (file, number)\n    content or data, is_snapshot\n    actor, subjects, provenance\n  }\n  class Edge {\n    entry-scoped: (source, target, edge_type)\n    weight, distance\n  }\n  Entry \"1\" --> \"0..*\" Observation : observed as\n  Observation \"1\" --> \"0..*\" Match : carries\n  Result \"1\" --> \"0..*\" Observation : rows\n  Result \"1\" --> \"0..*\" ResultError : evidence\n  Entry \"1\" --> \"0..*\" Chunk : split into\n  Entry \"1\" --> \"0..*\" Version : history of\n  Entry \"1\" --> \"0..*\" Edge : source or target of\n```\n\n## The picture: the 22 tables of one mount\n\n```mermaid\nflowchart TB\n  subgraph ns[\"The namespace: one row per file or directory\"]\n    entries[\"vfs_entries<br/>entry_id (ULID, unique) · parent_id · path (unique) · name · kind<br/>version · content_hash · mime_type · ext · lines · size_bytes<br/>source · render_* · owner_id · everyone_level<br/>chunked · encoded · indexable (dirty flags)<br/>deleted_at · trash_root_id (tombstone)\"]\n  end\n  subgraph bodies[\"Bodies: text or bytes, never both\"]\n    direction LR\n    content[\"vfs_content<br/>entry_id · content (text, or the rendering of a bytes body)\"]\n    blobs[\"vfs_blobs<br/>entry_id · data (bytes)\"]\n  end\n  subgraph history[\"History\"]\n    direction LR\n    versions[\"vfs_versions<br/>entry_id · version_number · is_snapshot · content or data<br/>content_hash · actor · provenance · source_identity · grant_revision\"]\n    vsubj[\"vfs_version_subjects<br/>entry_id · version_number · principal_id\"]\n  end\n  subgraph derived[\"Derived per entry, rebuilt by reindex\"]\n    direction LR\n    chunks[\"vfs_chunks<br/>entry_id · chunk_index · line_start · line_end · content · embedding\"]\n    edges[\"vfs_edges<br/>source_id · target_id · edge_type · weight · distance · provenance<br/>(the fs mirror edge, links edges, caller-authored edges)\"]\n    segments[\"vfs_segments<br/>segment · entry_id (ancestor directory names, for glob)\"]\n    signals[\"vfs_signals · vfs_signal_epochs<br/>a ranking prior per entry, under a generation\"]\n  end\n  subgraph gram[\"The gram index (grep)\"]\n    direction LR\n    gepochs[\"vfs_gram_epochs<br/>epoch · format_version · options_hash\"]\n    postings[\"vfs_grams_posting_list<br/>epoch · gram_key · postings (delta+varint blob)\"]\n  end\n  subgraph lex[\"The lexical index (glean, BM25)\"]\n    direction LR\n    lexdocs[\"vfs_lex_docs<br/>epoch · chunk_id · entry_id · dl\"]\n    lexpost[\"vfs_lex_postings<br/>epoch · term · block_no · doc_ids · tfs · dls\"]\n    lexdf[\"vfs_lex_df<br/>epoch · term · df · idf · max_weight · blocks\"]\n    lexstats[\"vfs_lex_stats<br/>epoch · n_docs · avg_dl · k1 · b\"]\n  end\n  subgraph rights[\"Rights\"]\n    direction LR\n    grants[\"vfs_grants<br/>principal_id · path_prefix · level · revision<br/>(posture rows have principal_id = *)\"]\n    members[\"vfs_memberships<br/>principal_id · group_id\"]\n    relabels[\"vfs_relabels<br/>path_prefix · revision · cursor (a posture change in flight)\"]\n    prev[\"vfs_principal_revisions<br/>principal_id · revision (keys the rights cache)\"]\n  end\n  subgraph control[\"Mount control\"]\n    direction LR\n    meta[\"vfs_meta (one row)<br/>schema_format_version · mount_identity · current_gram_epoch<br/>reindex_holder · reindex_heartbeat · embedding_model · grant_revision\"]\n    lock[\"vfs_lock (one row)<br/>the serialization point for move, copy, delete, restore, sweep\"]\n  end\n\n  entries --> content\n  entries --> blobs\n  content ~~~ versions\n  versions --> vsubj\n  versions ~~~ chunks\n  chunks ~~~ gepochs\n  gepochs ~~~ lexdocs\n  lexdocs ~~~ grants\n  grants ~~~ meta\n  entries -. parent_id is an entry_id .-> entries\n```\n\nEvery table in the derived, index and rights groups keys on\n`entry_id` or on an epoch; the arrows are left out so the groups read\nas rows.\n\n## Reading the picture\n\nStart with the three values a caller sees. An `Entry` is the stored\nfile or directory: the durable shape. An `Observation` is one row an\noperation returned about an entry at the moment it returned. It\ncarries a `populated` mask: a null field means \"not fetched by this\ncall\", never \"absent on the entry\". A `Result` is what every verb\nreturns: rows plus classified errors, and `success` is derived from\nthe errors, never stored. These three are the whole public data shape.\nChunks, versions and edges are entry-scoped: they belong to a file and\nare addressed by the file plus a discriminator, never by a path of\ntheir own.\n\nNow the tables. Every table keys on `entry_id`, a ULID minted once at\ncreate and never reused. `parent_id` is the one structural pointer and\nis also an `entry_id`. The `path` column is stored and unique, so a\nlookup is one statement at any depth; a directory move rewrites the\npaths beneath it. For agents, who look up far more than they rename,\nthis is the right trade.\n\nA body is text or bytes, never both. `source` on the entry row says\nwhich table holds it. A bytes body becomes searchable only through a\nrendering, text derived by a per-format renderer and written to the\ncontent row under the same `entry_id`.\n\nA delete is a tombstone on the row (`deleted_at`, `trash_root_id`),\nnot a move. An overwrite keeps the replaced body as a version row with\nthe attribution of who replaced it.\n\nThree dirty flags on the entry row say what the indexes do not yet\ncover: `chunked`, `encoded`, `indexable`. A write stamps the row dirty;\n`reindex` catches up in its own transactions. `grep` stays correct by\nscanning the dirty rows and consulting the index only for encoded ones.\n\nThe gram index and the lexical index are built under an epoch. Rows of\na new epoch are invisible until one pointer flip in `vfs_meta` publishes\nthem. Rights are rows too: a grant says a principal holds a rung at and\nbelow a prefix; a posture is a grant row for everyone, `*`.\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Entry** | The stored record of one file or directory. A pure pydantic value, never bound to a session. |\n| **Observation** | One row an operation returned about an entry, with a `populated` mask saying which fields this call fetched. |\n| **Populated mask** | The set of field names a call fetched. A null outside the mask means \"not fetched\"; inside it means \"fetched and null\". |\n| **Result** | The envelope every verb returns: `ops`, `observations`, `errors`, and extras. `success` is a property derived from the errors. |\n| **ResultError** | One classified error fact: a kind from the closed vocabulary, a composed message, a severity, a path. No producer writes prose (ADR 076). |\n| **Entry-scoped metadata** | Chunks, versions, edges: rows that belong to a file and are addressed by file plus discriminator, never by a path. |\n| **entry_id** | The 26-character ULID on every entry row: the permanent logical identity and the referential key every dependent table uses. Survives a move. Spec 181 exposes it read-only on `stat`. |\n| **parent_id** | The one structural pointer: the parent's `entry_id`. Authoritative for the hierarchy; the `fs` mirror edge follows it. |\n| **Body** | An entry's content: text in `vfs_content` or bytes in `vfs_blobs`, chosen by `source`. |\n| **Rendering** | The text derived from a bytes body by a renderer, stored in the content row and stamped on the entry (`render_source_hash`, `render_generation`, `render_status`). |\n| **Dirty flag** | `chunked`, `encoded`, `indexable` on the entry row: whether the chunks, the gram and lexical postings, and gram eligibility reflect the current body. |\n| **Epoch** | One built generation of the gram and lexical indexes. Invisible until published by the `current_gram_epoch` pointer flip. |\n| **Tombstone** | `deleted_at` and `trash_root_id` set on a row in place. The row keeps its path. |\n| **Version row** | The replaced body of an overwrite, with its number, hash, and the authority that replaced it. |\n| **Posture row** | A grant row whose principal is `*`: the level everyone holds at and below a prefix. |\n| **Everyone level** | `everyone_level` on the entry row: the deepest covering posture's rank, stamped at mint and rewritten when a posture changes. Derived, never authoritative. |\n| **Schema format** | The integer in `vfs_meta.schema_format_version`, bumped on every schema change; a mount at an old format is refused at first touch, never migrated silently (ADR 020). Today 23. |\n| **Serialization point** | The one-row `vfs_lock` table that the serialized verbs lock first, so they never interleave. |\n\n## A note on names\n\nThe constitution (`standards/constitution.md`, Article 1) still names\nthese values `VFSEntry`, `Candidate` and `VFSResult`, and gives the kind\nenum as `file | directory | chunk | version | edge | tool | api`. The\ncode and the ADRs since 015 and 034 use `Entry`, `Observation` and\n`Result`, and `ObjectKind` is `file | directory`. The constitution is\ndue a wording pass; this diagram follows the code.\n\n## Open\n\n- Specs 176, 177 and 180 each bump the schema format from 23; the\n  first to land takes 24.\n- Spec 180 fills `version_diff` with forward deltas for cold versions\n  (`pack`); today every version row is a snapshot.\n"}, {"id": "07-the-write-path", "file": "07-the-write-path.md", "title": "07. The write path: one transaction per mount", "markdown": "# 07. The write path: one transaction per mount\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n- **Shows:** what one `write` call does inside storage, in order: the\n  snapshot, the gate, the plan, the pinned statement order, the commit,\n  and what is deliberately left for `reindex`. The same discipline\n  serves `edit` and `mkdir`.\n- **Legend:** solid is built. Dashed is planned, with the spec named.\n- **Sources:** `src/vfs/storage/backends/database/writes.py`,\n  `staging.py`, `versions.py`, `edges.py`, `segments.py`, `labels.py`,\n  `rights.py` (`WriteGate`), `dialects.py` (arbitration, budgets);\n  ADR 025 (conflict redrive), 033 §6 (the index catches up later),\n  056 (bulk inserts), 087 pins 7 and 13; the OSTEP memo §2.2.\n\n## The picture\n\n```mermaid\nflowchart TB\n  in[\"write(entries=[...10,000 rows...], authority, overwrite, parents)\"] --> gate[\"Router half of the gate<br/>params · busy guard · capability · reserved grammar · permission layers\"]\n  gate --> hash[\"Measure each body: sha256, lines, size<br/>bodies of 100 KB or more hash off the event loop\"]\n  hash --> txn[\"Storage opens ONE transaction for the whole batch\"]\n\n  subgraph plan[\"Plan: no mutation statement yet\"]\n    snap[\"One chunked path IN select<br/>committed state of every target and ancestor\"]\n    wg[\"WriteGate: the caller's rung on every target and ancestor<br/>create needs add, overwrite needs contribute or own<br/>hidden and missing are indistinguishable\"]\n    stage[\"WritePlan (staging.py), pure Python<br/>POSIX parent and site gates against committed-plus-staged state<br/>minted parents, kind conflicts, overwrite refusals\"]\n    decide[\"Per entry: create, material update, or unchanged<br/>unchanged = same content_hash, nothing written\"]\n    snap --> wg --> stage --> decide\n  end\n  txn --> plan\n\n  decide -->|any error| refuse[\"Refuse the whole batch<br/>Result carries each bad row's kind; zero statements run\"]\n  decide -->|clean plan| exec[\"Execute (second picture)\"]\n  exec --> commit[\"COMMIT: whole-batch atomic on this mount\"]\n  commit --> out[\"Result: one row per entry<br/>status created, updated or unchanged; version; content_hash returned (spec 175)\"]\n\n  commit -.-> later[\"Left for reindex, in its own transactions:<br/>renderings, chunks, links edges, gram postings,<br/>lexical postings, embeddings, signals\"]\n```\n\n## The picture: the execution order\n\n```mermaid\nflowchart TB\n  subgraph exec[\"Execute, in pinned order\"]\n    direction TB\n    e0[\"0 · Label lookup (labels.py): one chunked read of the posture rows<br/>among the batch's ancestor prefixes; the everyone_level each new row will carry\"]\n    e1[\"1 · Entry inserts, parents before children, fresh creates only<br/>chunked by the dialect's parameter budget; row locks taken in path order<br/>everyone_level and the dirty flags are columns of the insert<br/>arbitration: upsert, or catch and retry, per dialect\"]\n    e2[\"2 · Path-segment postings for the fresh creates (segments.py)<br/>one row per ancestor directory name\"]\n    e3[\"3 · fs mirror edge for the fresh creates (edges.py)<br/>parent → entry, type fs\"]\n    e4[\"4 · Guarded material updates for the overwrites<br/>WHERE entry_id, version and path match the snapshot and the row is live<br/>(a revive drops the liveness term); the dirty flags clear in the same UPDATE<br/>a rowcount miss classifies conflict and redrives\"]\n    e5[\"5 · Version mint (versions.py)<br/>an overwrite or revive keeps the replaced body as a snapshot row<br/>with actor, subjects, provenance, grant_revision\"]\n    e6[\"6 · Body replace<br/>content or blob row delete then insert\"]\n    e7[\"7 · Guarded parent bumps<br/>each parent's version ticks, proving it still lives at its path\"]\n    e0 --> e1 --> e2 --> e3 --> e4 --> e5 --> e6 --> e7\n  end\n  exec --> commit[\"COMMIT\"]\n```\n\n## Reading the picture\n\nA write is not \"insert a row\". It is plan, then execute. First storage\nreads the committed state of every path the batch touches in one\nchunked statement. Then it decides the whole batch in memory: who may\nwrite where, which parents exist, which names collide, which bodies are\nunchanged. Only a plan with no error executes. A batch of 10,000 good\nrows and one bad row writes nothing, and the result names the bad row.\n\nExecution is a handful of bulk statements in a pinned order. The\nposture rows are read once so every new row carries its everyone\nlevel. Inserts go parents before children, with the label and the\ndirty flags as columns of the insert. The segment postings and the\n`fs` mirror edge follow for the fresh creates. Updates are guarded on\nthe entry id, version and path the plan read, so a rival who wrote in\nbetween makes the guard miss; the miss classifies `conflict` and the\nverb redrives from a fresh snapshot (ADR 025). Then the version mint,\nthe body replace, and the parent bumps. Row locks are taken in path\norder, so two batches that overlap cannot deadlock.\n\nWhat commits with the body: the entry row, the body row, the version\nrow holding the replaced body, the `fs` mirror edge, the path\nsegments, the everyone-level label, the dirty flags, and the parent\nbumps. One call on one mount commits whole or not at all, at any batch\nsize. A batch that spans two mounts is per-mount atomic only.\n\nWhat does not commit with the body: the search indexes. A write stamps\nthe row dirty. `reindex` builds chunks, postings, embeddings and\nsignals later, each in its own transaction. `grep` stays correct in\nbetween by scanning dirty rows (diagram 08).\n\nAn unchanged body costs nothing: same hash, no version row, no body\nwrite, no dirty flag, no `updated_at` churn. Re-running an ingestion\nover identical content writes nothing, which makes `updated_at` a\ntrustworthy change signal.\n\n## Statement counts (system actor, `ba77449`)\n\nCounts are the measure, never clocks (CLAUDE.md, *Performance tests*).\n\n| Verb | Statements |\n|---|---|\n| `write`, create at depth 1 | 6 |\n| `write`, overwrite | 8 |\n| `edit` | 7 |\n| `mkdir` | 5 |\n\nA named principal with a warm rights cache adds two statements to each.\nThe whole-body rewrite is the next cost to cut (ADR 087 pin 14).\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Plan then execute** | Fetch committed state once, adjudicate the whole batch in memory, execute only an error-free plan. |\n| **WritePlan, StagedEntry** | The in-memory plan and one path's planned final state, carrying the persistence bookkeeping an `Entry` never holds: the minted `entry_id`, the `base_version` guard. |\n| **Guarded update** | An `UPDATE` whose `WHERE` proves the row still has the entry id, version and path the plan read, and is live. A rowcount miss means a rival moved first. |\n| **Conflict redrive** | On a guard miss the verb classifies `conflict` and runs again from a fresh snapshot, within a retry budget (ADR 025). |\n| **Arbitration** | How two creates of the same path are settled: an upsert where the dialect has one, else catch the unique violation and retry. A `DialectProfile` field. |\n| **Version mint** | Writing the replaced body as a version row, with the replacing authority's attribution. Creates mint nothing; identical bodies mint nothing. |\n| **fs mirror edge** | One reserved-type `fs` edge row per non-root entry, parent to child, maintained in the same transaction. `parent_id` is authoritative; the mirror serves the graph verb. |\n| **Path segments** | One posting row per ancestor directory name of an entry, mirroring the `path` column at every commit, so glob can push literal directory components into SQL. |\n| **Parent bump** | Ticking each touched parent's version, with a guard proving the parent still lives at its path. |\n| **Whole-batch atomic** | The atomicity model of the write family: the whole call on one mount is one transaction (ADR 087 pin 7). |\n| **Parameter budget** | `dialect.insertmanyvalues_max_parameters`: the bind-parameter cap SQLAlchemy models; inserts chunk to it. |\n| **Membership budget** | The tighter of the parameter budget and the dialect's `IN`-list cap (Oracle: 1,000); every `IN (...)` chunks to it. |\n\n## What is planned, and where\n\n- `write(if_version=, if_absent=, append=)` and an `unchanged` status\n  with no version bump: spec 174. These close the lost-update append\n  the OSTEP probe found.\n- `content_hash` returned on every written row and verified on every\n  read: spec 175 (the column is already stamped on every write).\n- A request key answered from the stored first result: spec 177.\n- `overwrite=` may leave `write`, since `if_absent=True` is today's\n  `overwrite=False` (pending Clay).\n"}, {"id": "08-indexes-and-search", "file": "08-indexes-and-search.md", "title": "08. Indexes and search: reindex, grep, glean, graph", "markdown": "# 08. Indexes and search: reindex, grep, glean, graph\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n- **Shows:** the one maintenance verb, `reindex`, and the phases it\n  runs; then the read side, how `grep`, `glean` and `graph` answer\n  over the indexes plus the dirty overlay, with the Rust engine's\n  kernels named where they run.\n- **Legend:** solid is built. Dashed is planned, with the spec named.\n  Rust kernels are marked `[rust]`.\n- **Sources:** `storage/backends/database/backend.py` (`reindex`,\n  `_reindex_phases`), `indexing.py`, `lexical.py`, `render.py`,\n  `links.py`, `embed.py`, `signals.py`, `segments.py`, `edges.py`,\n  `grep.py`, `scope.py`, `glean.py`, `distance.py`, `graph.py`;\n  `storage/ranking.py`, `rerank.py`, `results/preview.py`;\n  `crates/vfs-core`; ADRs 033, 036, 038 to 046, 048, 049, 051 to 055,\n  059, 060, 077, 079.\n\n## The picture: reindex\n\n```mermaid\nflowchart TB\n  start[\"reindex() on one mount\"] --> lease[\"Claim the reindex lease<br/>vfs_meta.reindex_holder, heartbeat; a rival run refuses conflict\"]\n  lease --> render[\"1 · Render stage (render.py)<br/>bytes bodies whose stamp misses → text renderings<br/>pdf, docx, pptx, xlsx renderers, offloaded, paged, resumable\"]\n  render --> chunk[\"2 · Chunk pass (indexing.chunk_dirty)<br/>dirty bodies split into chunks: tree-sitter spans [rust] or recursive splitter<br/>markdown references extracted [rust] and published as links edges<br/>indexable stamp set\"]\n  chunk --> build[\"3 · Build a fresh epoch (indexing.build_epoch)<br/>trigram postings over indexable bodies [rust: grams, postings]<br/>lexical index: tokenize, BM25 blocks, summaries, stats [rust: lexical]<br/>rows written under the new epoch, invisible\"]\n  build --> publish[\"4 · Publish (indexing.publish_epoch)<br/>flip encoded = true per entry, version-guarded<br/>compare-and-set vfs_meta.current_gram_epoch\"]\n  publish --> reclaim[\"5 · Reclaim dead epochs\"]\n  reclaim --> seg[\"6 · Re-converge path segments (segments.py)<br/>guarded deltas toward the recomputed truth; drift reported\"]\n  seg --> edge[\"7 · Re-converge fs mirror edges (edges.py)\"]\n  edge --> sig[\"8 · Signals phase (signals.py)<br/>collect the reference graph in keyset pages<br/>centrality prior, smoothed through the tree [rust: signals]<br/>publish a new generation, flip the pointer, sweep the old\"]\n  sig --> embed[\"9 · Embed step (embed.py), only with an embedder<br/>keyset pages of chunks with embedding IS NULL<br/>batches embed with NO transaction open<br/>UPDATE ... WHERE id = :id AND embedding IS NULL\"]\n  embed --> release[\"Release the lease; Result carries rendering and embedding extras\"]\n  sig -.-> pack[\"planned: pack, cold version rows into deltas (spec 180)\"]\n\n  classDef planned stroke-dasharray: 6 4,stroke-width:2px;\n  class pack planned\n```\n\nEach numbered phase runs in its own writer transaction. The render\nand embed loops are resumable: they commit in bounded pages behind a\ndurable mark, so a second run finishes what the first left.\n\n## The picture: grep\n\n```mermaid\nflowchart TB\n  q[\"grep(pattern, paths, globs, ext ...)\"] --> compile[\"Compile the pattern: regex-crate language<br/>refuse what the engine refuses; per-line law (pattern_matching/grep.py)\"]\n  compile --> plan[\"Plan folded trigrams from the pattern (code_grams.py)<br/>no gram predicate → refuse unless allow_scan=True\"]\n  plan --> scope[\"Structural scope (scope.py)<br/>globs and ext channels compiled to terms; the permission view joined in\"]\n  scope --> idx[\"Index side: encoded rows<br/>fetch the rarest grams' posting blobs for the current epoch<br/>candidate_ids [rust]: decode, intersect, union, meet the scope allow-list, cap\"]\n  scope --> overlay[\"Overlay side: NOT encoded rows<br/>bounded, structurally prefiltered fetch of dirty bodies\"]\n  idx --> gates[\"Structural gates off the rows' own stored facts<br/>before any content fetch\"]\n  overlay --> gates\n  gates --> verify[\"Verify every candidate through the one matcher<br/>ContentMatcher.hit_lines or count_lines [rust], offloaded per batch\"]\n  verify --> hits[\"Result: Observation rows with Match lines<br/>budget_exhausted.truncated as a warning when the cap bites\"]\n```\n\n## The picture: glean\n\n```mermaid\nflowchart TB\n  q[\"glean(query, limit, paths, globs, ext ...)\"] --> tok[\"Tokenize the query with the index's own tokenizer [rust]\"]\n  tok --> lex[\"Lexical leg (glean.py)<br/>round one: summary rows and head blocks per term, score [rust]<br/>round two: select_blocks [rust] asks which later blocks can change the top-k; fetch exactly those<br/>every statement is a key fetch, no scoring SQL\"]\n  q --> vec[\"Vector leg, only with an embedder<br/>embed the query through the provider<br/>cosine distance in the engine (distance.py, per dialect)<br/>referee: vector_topk [rust], wrapped by cosine_topk in vector.py\"]\n  lex --> agg[\"Aggregate chunks to entries: the best chunk speaks for its entry\"]\n  vec --> agg\n  agg --> norm[\"Normalise each leg to the unit interval<br/>cosine by its range, BM25 by min-max (ranking.py)\"]\n  norm --> fuse[\"Fusion declared on the mount's Ranker<br/>Convex weights, never chosen per call\"]\n  fuse --> prior[\"Multiply in stored signals (signal_factors)<br/>the centrality prior, read never computed on the query path\"]\n  prior --> preview[\"Query-biased preview per hit (results/preview.py)<br/>cut from the chunk text, no second fetch\"]\n  preview --> one[\"One mount's ranked list\"]\n  one -.-> rerank[\"Several mounts: rerank.py<br/>one BM25 over the union; a mount's own order is never changed\"]\n```\n\n## The picture: graph\n\n```mermaid\nflowchart LR\n  seeds[\"graph(method, path or observations, depth, edge_types)\"] --> hop[\"One hop: one chunked statement per frontier chunk<br/>vfs_edges in the walk's direction, joined to vfs_entries on the far endpoint<br/>liveness term, type filter, the caller's view at the list rung\"]\n  hop --> judge[\"Judge every row<br/>readable: whole; nameable only: bare (path and kind)<br/>a hidden directory on the road: passed as a bare name\"]\n  judge --> next[\"Far nodes join the frontier; visited set; stop at depth or limit (128)\"]\n  next --> hop\n  next --> induced[\"Fetch the edges among the returned nodes once<br/>Observation.depth; edge rows carry type and measure\"]\n```\n\n## Reading the picture\n\nvfs keeps four indexes and one derived table, and `reindex` is the one\nverb that builds them: the gram index for `grep`, the lexical index\nfor `glean`'s BM25 leg, the vector column for `glean`'s cosine leg,\nthe stored signals for `glean`'s prior, and the `links` edges that\nfeed `graph`. The write path does not build any of them. It stamps the\nrow dirty and moves on, because an ETL batch of 10,000 files must not\nwait for tokenising, embedding or tree-sitter.\n\nThe gram and lexical indexes are built whole under a fresh epoch and\npublished by one pointer flip. Between the write and the publish, the\nrow's `encoded` flag is false, and `grep` scans it. That is why `grep`\nhas two sides: the index side over encoded rows and the overlay side\nover dirty rows. Both pass the same structural gates and the same\nmatcher. The matcher is the one authority on what \"matches\" means, and\nit lives in the Rust engine.\n\n`glean` is grep's shape with a scorer where grep has a matcher. Its\nlexical leg never runs scoring SQL: every statement is a key fetch, and\nthe engine scores. Its vector leg runs cosine inside the SQL engine,\nbecause every supported dialect has a distance function (ADR 059);\nthe Rust kernel is the referee the dialects are pinned against. The two\nlegs are normalised and fused under a law declared once on the mount.\n\n`graph` is a frontier walk the application holds. Each hop is one\nchunked statement, and every row is judged against the caller's view\nbefore it joins the frontier. A node the caller may read comes back\nwhole; one it may only name comes back bare.\n\nThe permission view is a filter inside every one of these statements,\nnever a pass over the rows afterwards. That is the fact that makes the\nquery verbs kernel operations (ADR 087 pin 2).\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **reindex** | The one maintenance verb: renderings, chunks, links, gram and lexical epochs, segments, edges, signals, embeddings. Runs under a lease. |\n| **Lease** | `vfs_meta.reindex_holder` plus a heartbeat. One `reindex` per mount at a time; a rival refuses `conflict`. |\n| **Gram, trigram** | Three consecutive bytes of a folded body, packed into 24 bits. The key of the gram index. |\n| **Posting list** | One gram's sorted list of entry ids, stored as a varint count plus LEB128 deltas. Decoded only in the engine. |\n| **Epoch** | One built generation of the gram and lexical indexes. Built invisible, published by a pointer flip, reclaimed when dead. |\n| **encoded** | The entry flag meaning \"this row's postings are in the current epoch\". False means grep scans it. |\n| **Overlay, scan side** | The dirty rows `grep` reads directly because the index does not cover them. Always correct, slower. |\n| **Candidate** | An entry the gram index nominates for a pattern. May be a false positive; the matcher decides. Never a false negative. |\n| **Matcher** | `ContentMatcher`, the Rust `verify` kernel's class: the one definition of a grep match for every surface, with `count_lines` and `hit_lines` per batch. |\n| **Chunk** | One indexed unit of a body, split by tree-sitter spans for code and markup or by the recursive splitter. The unit the lexical index and the embedding describe. |\n| **Lexical index, BM25** | The ranked text index: per-term blocks of postings with term frequencies and lengths, plus summary rows that bound every block. |\n| **Block, summary** | The lexical index stores up to `BLOCK_SIZE` postings per `(term, block)` row and one summary row per term, so round two can skip blocks that cannot change the top-k. |\n| **Leg** | One ranked source inside `glean`: the lexical leg or the vector leg, each aggregated to entries and normalised. |\n| **Fusion, Ranker** | How a mount combines its legs: a `Convex` weighting declared on the `Ranker` at construction. |\n| **Signal, prior** | A query-independent importance score per entry in `[0, 1]`, computed during `reindex` from the reference graph and the tree, read on the query path. |\n| **Preview** | The query-biased excerpt cut from a hit's chunk text; bounded by construction. |\n| **Embedding provider** | The seam `reindex` fills `chunks.embedding` through: `model_id`, `dimension`, request caps, embed one batch. Storage owns budgets and the loop. |\n| **Frontier walk** | `graph`'s algorithm: the application holds the frontier and the visited set; each hop is one chunked statement; every row is judged. |\n| **links edge** | An edge minted from a markdown reference in a body, resolved against the live tree during the chunk pass. |\n| **Rust kernel** | A compute routine `crates/vfs-core` exports through `vfs._native`: `distinct_gram_count`, `PostingsBuilder`, `candidate_ids`, `ContentMatcher` (`count_lines`, `hit_lines`), `chunk_spans`, `markdown_refs`, `tokenize`, `LexicalBuilder`, `lexical_score`, `decode_summary`, `select_blocks`, `vector_topk`, `centrality_prior`. The Python wrappers `cosine_topk` and `Chunk.split_batch` sit over `vector_topk` and `chunk_spans`. |\n\n## Open\n\n- `glean` fetches 1,000 candidate entries and builds a preview\n  unconditionally; both are recorded for a spec of their own (memo\n  2026-10-10).\n- Stored signals may count hidden in-links; grep's candidate budget\n  counts hidden candidates (`open-questions.md`).\n- `pack` as a `reindex` phase: spec 180.\n"}, {"id": "09-identity-and-rights", "file": "09-identity-and-rights.md", "title": "09. Identity and rights: who a call is for, and what it may see", "markdown": "# 09. Identity and rights: who a call is for, and what it may see\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n- **Shows:** the one identity value every call carries, the permission\n  ladder, the rows that grant rights, how storage compiles a caller's\n  rights into every statement, and the three places a refusal can come\n  from. Everything here is built unless marked.\n- **Legend:** solid is built. Dashed is planned, with the spec named.\n- **Sources:** `src/vfs/authority.py`, `ops.py` (the ladder,\n  `VERB_RUNGS`), `permissions.py`, `storage/grants.py`,\n  `storage/backends/database/rights.py`, `ranges.py`, `labels.py`,\n  `revision.py`; `docs/reference/glossary.md`; ADRs 062 to 073, 080;\n  spec 165 (landed 2026-10-14).\n\n## The picture: the identity value\n\n```mermaid\nflowchart TB\n  subgraph doors[\"Four doors build an Authority\"]\n    direction TB\n    d1[\"Authority.of(principal)<br/>one subject, acting as itself\"]\n    d2[\"Authority.on_behalf_of(subjects, actor=agent)<br/>an agent working for people\"]\n    d3[\"Authority.system()<br/>no subjects; bypasses grants; mount administration\"]\n    d4[\"Authority.anonymous()<br/>the principal anon; holds only the everyone level\"]\n  end\n  subgraph value[\"Authority: a frozen value on every call\"]\n    dir

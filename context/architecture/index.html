ection TB\n    s[\"subjects: frozenset of Principal<br/>whose grants apply; at most 64\"]\n    a[\"actor: Principal<br/>who does the work; recorded on every version row\"]\n    p[\"provenance: edge, constructed or system<br/>how the identity was proven\"]\n    n[\"narrowing: Narrowing.NONE today<br/>what the session gave up (spec 148)\"]\n    si[\"source_identity<br/>the raw edge identity, for the audit trail\"]\n  end\n  doors --> value\n  value --> admitted[\"_admitted at the router<br/>explicit → default_authority → anonymous\"]\n  admitted --> storage[\"storage receives an Authority on every call\"]\n```\n\n## The picture: the ladder, the rows, the row\n\n```mermaid\nflowchart TB\n  subgraph ladder[\"The ladder, lowest rung first\"]\n    direction LR\n    l0[\"none\"] --> l1[\"list<br/>name a row:<br/>path and kind\"] --> l2[\"read<br/>see it whole\"] --> l3[\"add<br/>create beneath,<br/>alter only your own\"] --> l4[\"contribute<br/>edit anyone's,<br/>trash only your own\"] --> l5[\"read_write<br/>everything,<br/>grants included\"]\n  end\n  subgraph verbs[\"Every verb names its rung: VERB_RUNGS in ops.py\"]\n    v[\"stat, ls, tree, glob → list · read, grep, glean, graph, grants → read<br/>write, mkdir, edit, mkedge, rmedge → contribute; write and mkdir mint a fresh name at add<br/>delete, move, copy, restore, grant, revoke, posture, sweep, add_member, remove_member → read_write;<br/>move and copy mint at add · a walk and an edge's far end pass at list; a copy's source at read\"]\n  end\n  subgraph rows[\"Rows that give rights (vfs_grants, vfs_memberships)\"]\n    direction TB\n    g[\"grant row: principal_id · path_prefix · level<br/>additive: holds the level at and below the prefix; no deny rows\"]\n    po[\"posture row: principal_id = *<br/>the level everyone holds; deepest prefix wins; default read_write\"]\n    m[\"membership: principal_id ∈ group_id<br/>a member holds its groups' grants, nested up to 8 deep\"]\n  end\n  subgraph row[\"Facts on the entry row\"]\n    direction TB\n    e[\"everyone_level: the deepest covering posture's rank<br/>stamped at mint, rewritten by a relabel when a posture changes\"]\n    o[\"owner_id: set once at creation from the authority<br/>the owner floor: an owner can always read and write its row\"]\n  end\n  l5 ~~~ v\n  v ~~~ g\n  g ~~~ po\n  po ~~~ m\n  m ~~~ e\n  e ~~~ o\n```\n\n## The picture: from an Authority to a statement\n\n```mermaid\nflowchart TB\n  auth[\"Authority (subjects, actor)\"] --> stamps[\"resolve_authority (rights.py), inside the verb's transaction<br/>read the subjects' and their groups' stamps in vfs_principal_revisions<br/>and the relabels in flight\"]\n  stamps --> cache{\"RightsCache hit?<br/>keyed on the greatest stamp over the subjects and groups,<br/>plus the relabel marks in flight\"}\n  cache -->|yes| rights\n  cache -->|no| compile[\"Compile (grants.py, pure)<br/>per subject: own grants ∪ group grants, max within<br/>across subjects: the meet, every member must hold it (ADR 066)<br/>→ Rights: level, spans, owner arms, roots, holes\"]\n  compile --> rights[\"Rights at the verb's rung\"]\n  rights --> read[\"Read verb: Visibility<br/>the three-seek predicate (ranges.py)\"]\n  rights --> write[\"Mutation: WriteGate<br/>rung on every target and ancestor, once per batch\"]\n  read --> pred[\"WHERE<br/>everyone_level ≥ r (index: everyone_level, path)<br/>UNION ALL path in the caller's sorted ranges (joined to the path index)<br/>UNION ALL owner_id in the caller's owner arms<br/>the statement text never changes with the number of grants\"]\n  pred --> rowsout[\"Rows the caller may see; a hidden row looks absent\"]\n  write --> verdict[\"Whole batch passes, or fails whole with not_found or permission_denied\"]\n```\n\n## The picture: three places a refusal comes from\n\n```mermaid\nflowchart LR\n  call[\"a call\"] --> r1[\"Router: structural PermissionMap layers<br/>a read map on a binding, prefix overrides<br/>composes downward, only tightens → the read_only error\"]\n  r1 --> r2[\"Storage: anonymous judged at the addressed path<br/>posture there below the verb's rung → unauthenticated\"]\n  r2 --> r3[\"Storage: the caller's rights<br/>a hidden or missing row → not_found<br/>a nameable row without the rung → permission_denied\"]\n  r3 --> ok[\"the verb runs over the visible set\"]\n```\n\n## Reading the picture\n\nEvery call carries one value that says who it is for and who is doing\nthe work. That value is an `Authority`. It is frozen and hashable, and\nit caches no decision. Rights are re-derived on every call, so a grant\nrevoked at noon takes effect on the next call. The cost is paid by a\ncache keyed on a revision stamp, not by remembering a verdict.\n\nRights come from rows. A grant row says a principal holds a rung at\nand below a prefix. Rows only widen; there is no deny row. A posture is\na grant row for everyone, and it is the one thing that can narrow,\nbecause the deepest posture wins. A group is a principal whose\nmembership rows say who belongs; a member holds its groups' grants.\n\nA set of subjects holds a right only when every member holds it. That\nis the intersection law. An agent working for Alice and Bob sees what\nboth may see.\n\nStorage compiles the caller's rights into every statement. The\neveryone level is stamped on each row, so the common case is one index\nseek. The caller's own grants travel as sorted path ranges joined to\nthe path index. The rows the caller owns are a third branch. The three\nbranches are disjoint and merge with `UNION ALL`, so no engine plans a\ndeduplication and the statement text never changes with the number of\ngrants. A row the caller may not see is not fetched. It looks exactly\nlike a row that does not exist, and it never counts in search\nstatistics (ADR 065).\n\nA mutation passes a write gate first: one batched fetch of the targets\nand their ancestors, judged in application code against the verb's\nrungs. Any refusal fails the batch whole.\n\nThe router has its own, older layer: a structural `PermissionMap` per\nbinding whose values are `read` and `read_write` (built by the\n`read_only()` and `read_write()` factories) that can make a mount or a\nprefix read-only for everyone. It composes downward and only tightens.\nIt is not about who the caller is.\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Principal** | One verified identity: `sub` (the token's subject claim), a kind (`user`, `service`, `system`, `anonymous`), scopes. |\n| **Authority** | The frozen value on every call: subjects, actor, provenance, narrowing, source identity. Built only through the four doors. |\n| **Subjects, actor** | Whose grants apply, and who does the work. Kept apart so neither the agent nor the people are hidden in the record. |\n| **System actor** | `Authority.system()`: no subjects, bypasses grants, stamps whatever owner a payload declares. Mount administration runs as it. Refused on the wire. |\n| **Anonymous principal** | `anon`: what a call runs as when nothing names an authority and the filesystem has no default. Holds only the everyone level; owns nothing. |\n| **Ladder, rung** | The total order `none < list < read < add < contribute < read_write`. Each rung includes the ones below. Every verb's rung is one row in `VERB_RUNGS`. |\n| **Needs** | A verb's rungs: on its target (`primary`), on a fresh name it mints (`create`), on a row it only passes or reads (`traverse`). |\n| **Grant** | A row: a principal holds a rung at and below a prefix. Additive. |\n| **Posture** | The everyone level at and below a prefix, stored as a grant row for `*`. The deepest covering posture wins. Default `read_write`. |\n| **Group** | A principal id starting with `group:`. Membership rows nest up to eight levels. |\n| **Intersection law** | A subject set holds a right only when every member does; the set's coverage is the meet of the members' coverage (ADR 066). |\n| **Owner floor** | A principal named in `owner_id` can always read and write that row. |\n| **Everyone level** | `everyone_level` on the entry row: the deepest covering posture's rank, derived, rewritten by a relabel. |\n| **Relabel** | The resumable pass that rewrites `everyone_level` under a prefix after a posture change, in bounded chunks behind a cursor in `vfs_relabels`. Readers compile the span in flight as a cover or a hole. |\n| **Rights** | The compiled result for one caller at one rung: level, spans, owner arms, roots, holes. Pure, in `storage/grants.py`. |\n| **RightsCache** | The per-mount cache of compiles, keyed on the greatest `principal_revisions` stamp over the caller's subjects and groups plus the relabel marks in flight. A grant write retires its grantee's compile. |\n| **Grant revision** | `vfs_meta.grant_revision`: advanced as the first statement of every grants write, so rival admin writes serialise; stamps version rows and grant rows. |\n| **Visibility** | Storage's compile of what one read call may see at the verb's rung. |\n| **WriteGate** | Storage's point check before a mutation's first write statement. |\n| **Three-seek predicate** | The visibility clause: everyone level, grant ranges, owner arms, merged by `UNION ALL`. |\n| **Road directory** | A hidden directory with a visible row beneath it. Listed as a bare name; refuses every write beneath it. |\n| **Hidden row** | A row the caller holds no rung on. Answers `not_found` like a missing path; never counted in statistics. |\n| **PermissionMap** | The router's structural layer: a default of `read` or `read_write` per binding with prefix overrides (the `read_only()` and `read_write()` factories build one). Composes downward, only tightens. Not per caller. |\n| **Unauthenticated** | The mount-side refusal of an anonymous call at a path whose posture is below the verb's rung. The hint names the fix. |\n\n## What is planned, and where\n\n- `Narrowing` beyond `NONE`, sub-sessions, the subject set's lifecycle:\n  spec 148 (seed).\n- A token in and an `Authority` out at `serve()`: spec 149 (seed).\n- Three enforcement gaps noticed in the 2026-10-07 teaching session,\n  a `manage` rung, and group ownership: `open-questions.md`.\n"}, {"id": "10-history-trash-and-the-atomic-unit", "file": "10-history-trash-and-the-atomic-unit.md", "title": "10. History, trash, the atomic unit and the fault model", "markdown": "# 10. History, trash, the atomic unit and the fault model\n\n- **Status:** living diagram, drawn 2026-10-24 against `ba77449`.\n  Draws ADR 087's promises (pins 7 to 11, 13) beside what the code\n  does today.\n- **Shows:** what happens to a body when it is replaced, to a row when\n  it is deleted, and to the store when something fails. The two\n  atomicity models every verb belongs to. The fault model: which layer\n  catches which fault.\n- **Legend:** solid is built. Dashed is planned, with the spec named.\n- **Sources:** `storage/backends/database/versions.py`, `trash.py`,\n  `serialized.py`, `topology.py`, `engine.py`, `dialects.py`;\n  `models/versioning.py`; ADRs 013, 017, 025, 027, 064, 074, 078,\n  087; specs 174, 175, 177, 180; the OSTEP memo §2.\n\n## The picture: the life of a row\n\n```mermaid\nstateDiagram-v2\n  [*] --> Live : write (create)<br/>entry_id minted, version 1, no version row\n  Live --> Live : write of an identical body<br/>nothing written, status unchanged\n  Live --> Live : overwrite or edit<br/>version +1; the replaced body becomes a version row<br/>with actor, subjects, provenance\n  Live --> Live : move<br/>path rewritten, entry_id kept, edges follow\n  Live --> Tombstoned : delete<br/>deleted_at and trash_root_id set in place<br/>path kept; edges hide with the row\n  Tombstoned --> Live : restore<br/>the root's set is cleared\n  Tombstoned --> Live : write at the path, a revive<br/>same entry_id, the old body kept as a version\n  Tombstoned --> [*] : sweep<br/>the row, its bodies, versions, chunks, edges destroyed<br/>the entry_id is never reused\n```\n\n## The picture: the two atomicity models\n\n```mermaid\nflowchart LR\n  subgraph whole[\"Whole-batch: one call on one mount is one transaction\"]\n    w[\"write, edit, mkdir, move, copy, delete, restore,<br/>mkedge, rmedge, grant, revoke, posture's own row, sweep (today)<br/>10,000 rows: one commit · 10,000 good plus one bad: zero rows\"]\n  end\n  subgraph resumable[\"Resumable: bounded chunks behind a durable mark\"]\n    r[\"relabel after a posture change (cursor in vfs_relabels)<br/>reindex: render pages, embed pages, pack (spec 180)<br/>sweep with a limit and a resumption key (spec 180)\"]\n  end\n  subgraph cross[\"Across mounts\"]\n    c[\"per-mount atomic only; a batch can land in part<br/>cross-mount atomicity is a designed entry point if ever wanted, never a router tweak\"]\n  end\n```\n\n## The picture: the serialized verbs and the rivals\n\n```mermaid\nflowchart TB\n  sv[\"move · copy · delete · restore · sweep\"] --> lock[\"first statement: lock the one row of vfs_lock<br/>the per-mount serialization point (serialized.py)\"]\n  lock --> snap[\"read the snapshot inside the same transaction<br/>refusals judge post-rival state\"]\n  snap --> claims[\"guarded claims on the version each row was judged at\"]\n  claims -->|a guard misses| redrive[\"classify conflict; redrive the whole verb from a fresh snapshot<br/>retry waits are jittered inside a doubling step\"]\n  claims -->|all hold| commit[\"commit\"]\n  writes[\"write · edit · mkdir<br/>NOT serialized: guarded on the version read, locks in path order\"] -.-> claims\n```\n\n## The picture: the fault model\n\n```mermaid\nflowchart TB\n  subgraph engine[\"The SQL engine owns\"]\n    e1[\"media faults, torn pages, its own log and recovery\"]\n    e2[\"atomic commit of any size\"]\n    e3[\"row locks and isolation (pinned per dialect)\"]\n  end\n  subgraph vfs[\"vfs owns, above the engine\"]\n    v1[\"logical faults: a body under the wrong id, a dropped body insert,<br/>an out-of-band writer with SQL credentials<br/>detector: content_hash on the entry row (verify on read: spec 175)\"]\n    v2[\"partial failures: timeouts, deadlocks, lost serialization races, dropped connections<br/>response: retryable classes per dialect, the conflict redrive, the busy and unavailable kinds\"]\n    v3[\"identity: ULIDs minted once, skipped epochs, tombstones instead of frees<br/>a delete then a write at the same path revives the same entry_id; fresh only after a sweep\"]\n    v4[\"replay: every mutating verb safe to send twice or recognisable on the second send,<br/>or it takes a request key answered from the stored first Result (spec 177)\"]\n  end\n  subgraph outside[\"Outside the contract\"]\n    o1[\"out-of-band edits to the tables; vfs has no second copy to repair from.<br/>A report-only scrub reads what nobody reads and reports (spec 175)\"]\n  end\n  engine --> vfs --> outside\n\n  classDef planned stroke-dasharray: 6 4,stroke-width:2px;\n```\n\n## Reading the picture\n\nA file's history is kept, not reconstructed. When a body is replaced,\nthe body it replaced is written to a version row in the same\ntransaction, whole, with who replaced it. A create mints nothing. An\nidentical body mints nothing, because nothing was lost. Today every\nversion row is a snapshot; `pack` (spec 180) will later rewrite cold\nranges into a snapshot plus forward deltas, and no version row is ever\ndeleted by default.\n\nA delete is a tombstone. The row stays at its path with `deleted_at`\nand `trash_root_id` set. Nothing moves: no path rewrite, no posting\nmove, no edge cascade. The trash view at `/.vfs/trash` shows the\ntombstoned rows at their own paths. `restore` clears the set. A write\nat a tombstoned path revives the row with the same `entry_id`. Only\n`sweep` destroys, and it is a developer-plane verb that agents never\nsee.\n\nvfs has two atomicity models and names them. Whole-batch verbs commit\nthe whole call on one mount in one transaction. Resumable verbs commit\nin bounded chunks behind a durable mark, so a second run finishes what\nthe first left. Every verb is one or the other.\n\nThe serialized verbs rewrite or hide parts of the tree that other rows\ndepend on, so they take the per-mount lock row first and never\ninterleave. Writes are deliberately not serialized with them; every\nclaim a write makes is guarded on the version it read, and a miss\nredrives.\n\nThe fault model is written once. The engine owns the media and the\natomic commit. vfs owns the logical faults above it, and the detector\nis the hash it already stores. Engines fail partially, not fail-stop,\nso the response is a classified retry, never a crash. Identities are\nnever reused.\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **Version** | A file's per-entry revision counter, bumped on every material change. Also the number on a version row. |\n| **Version row** | The replaced body kept whole, with actor, subjects, provenance, source identity and grant revision. |\n| **Snapshot, delta** | A version row holding the whole body, or (planned, spec 180) a forward diff from the previous one. |\n| **Pack** | Planned (spec 180). A `reindex` phase that rewrites cold version ranges into a snapshot plus deltas. ADR 017's name. |\n| **Tombstone** | `deleted_at` and `trash_root_id` on a row in place. A delete sets it; a restore clears it. |\n| **Trash root** | The row a delete named; every row in its subtree carries its id, so `restore` clears a root's set in one statement. |\n| **Revive** | A write at a tombstoned path: the same `entry_id` comes back live and the old body is kept as a version. |\n| **Sweep** | The one destroying verb: tombstoned rows, their bodies, versions, chunks and edges. Developer plane. Planned: a limit and a resumption key (spec 180). |\n| **Atomic unit** | The largest piece of work that commits whole or not at all. One call on one mount. |\n| **Whole-batch** | The atomicity model where the whole call is one transaction. |\n| **Resumable** | The atomicity model where the call commits in bounded chunks behind a durable mark. |\n| **Serialized verb** | `move`, `copy`, `delete`, `restore`, `sweep`: a verb that takes the serialization point first. |\n| **Serialization point** | The one row of `vfs_lock`, locked by a serialized verb's first statement. Nothing else reads it, so it never holds up a write or a read. |\n| **Guarded claim** | A mutation that proves the row still has the version it was judged at. |\n| **Redrive** | Running a verb again from a fresh snapshot after a guard miss, classified `conflict`, within a retry budget with jittered waits. |\n| **Fault model** | Which layer catches which fault: the engine owns media and commit; vfs owns logical faults and partial failures. |\n| **Fail-partial** | How engines fail in practice: timeouts, deadlocks, lost races, dropped connections, not a clean stop. |\n| **Replay, request key** | Planned (spec 177). Every mutating verb is safe to send twice or recognisable on the second send; the ones that cannot be take a key answered from the stored first result. |\n| **Scrub** | Planned (spec 175). A paced, report-only read of everything, version rows included, comparing bodies to their hashes. |\n| **Garbage, gauge** | Planned (spec 180). Tombstoned rows, version rows and bytes per mount; a cheap read a deployment job consults before it cleans. |\n\n## What the probes found (2026-10-24), and the spec that closes each\n\n| Probe | Finding today | Closed by |\n|---|---|---|\n| Twenty concurrent read-then-write appends | one line survived, all reported success | `write(if_version=)` and the guarded append, spec 174 |\n| A body changed under vfs with direct SQL | `read` served it as success | verify on read, spec 175 |\n| A replayed `move` | a bare `not_found`; \"already moved\" and \"never existed\" look alike | the replay table and the request key, spec 177 |\n\nSix contract-free fixes landed the same day (`25f6da4` to `ba77449`):\nrow locks in path order, jittered retry waits, three hidden statements\nremoved, the write-path hash offloaded above 100 KB.\n\n## Open\n\n- Pin 17: on `move(replace=True)`, the destination's identity survives\n  (spec 167's lean) or the source's (POSIX's).\n- The replay row's time to live (spec 177 leans 24 hours).\n- Whether an integrity failure is a kind of its own or rides\n  `unavailable`.\n"}, {"id": "11-the-agent-shell-programs-and-the-fronts", "file": "11-the-agent-shell-programs-and-the-fronts.md", "title": "11. The agent shell, programs and the fronts (planned)", "markdown": "# 11. The agent shell, programs and the fronts (planned)\n\n- **Status:** living diagram, drawn 2026-10-24. **Nothing on this page\n  is built.** It draws the decided target: ADRs 081 to 086 (proposed\n  2026-10-15 and 2026-10-16) and specs 167 to 172; specs 167, 171 and\n  172 carry rebase notes of 2026-10-24 for ADR 087.\n- **Shows:** how an agent's command line becomes gated kernel calls;\n  the six kinds of program behind one ABI; the pipe; the `/.vfs`\n  views; the MCP adapter; the WASI mount for a Python guest.\n- **Legend:** every box here is planned. The spec that lands each is\n  named on it.\n- **Sources:** ADR 081 (the grammar), 082 (programs and views), 083\n  (the pipe), 084 (the execution policy), 085 (the content channel),\n  086 (Python in vfs); specs 167, 168, 169, 170, 171, 172; the memos\n  of 2026-10-15 (the agent shell) and 2026-10-23 (wasi-python over\n  vfs).\n\n## The picture: a command line becomes kernel calls\n\n```mermaid\nflowchart TB\n  cmd[\"cli: grep -rn mfa /enterprise | head -20<br/>(the one programmatic execution door; a verb on the router and the Session)\"] --> parse[\"Parser (shell/parse.py, spec 167 B)<br/>the whole string to an AST before anything runs<br/>bash-shaped POSIX subset; refused constructs are classified facts (ADR 081)\"]\n  parse --> resolve[\"Resolve each name (ADR 082 pin 10)<br/>shell builtins → the kernel's program table → /.vfs/bin in index order<br/>a stored program needs read on its entry: 127 cannot list, 126 cannot read\"]\n  resolve --> plan[\"Plan the pipeline (shell/run.py, spec 167 C)<br/>shapes known before running: rows or bytes per seam<br/>budgets set: stages, argv bytes, fan-out, stdout bytes, wall time\"]\n  plan --> run[\"Run the stages\"]\n  subgraph stages[\"Each stage is a Program behind one ABI (ADR 082 pin 1)\"]\n    abi[\"Call: args, env, cwd, stdin, stdout, stderr, fs, budget<br/>declares name, consumes, produces, forms\"]\n    fs[\"fs = the router's verbs curried with the caller's Authority<br/>VirtualFileSystem.bound(authority); no authority parameter, no grant verbs, absolute paths only<br/>every call re-enters the public router method, so every gate fires (ADR 084)\"]\n  end\n  run --> stages\n  stages --> gate[\"THE GATE (diagram 04): capability → grammar → permission, on every verb\"]\n  gate --> result[\"one cli Result: stdout then stderr as the display,<br/>rows as the structured stdout, classified errors, exit code and the status list\"]\n```\n\n## The picture: six kinds behind one name\n\n```mermaid\nflowchart LR\n  name[\"a program name, e.g. grep, sed, python3, my_tool\"] --> table[\"the program table: (name, kind, forms, program)<br/>the name is the contract; the kind is a table row\"]\n  table --> k1[\"Verb builtin<br/>the shell's code over vfs verbs<br/>ls, cat, grep, find, mkdir ... (spec 167)\"]\n  table --> k2[\"Text program<br/>Python shell around a Rust kernel, bytes to bytes<br/>sed, awk, cut, sort, wc, diff ... (spec 168)\"]\n  table --> k3[\"Program<br/>wasm bytes stored in vfs, run in a sandbox as the caller<br/>installed by write into /opt/bin (spec 169)\"]\n  table --> k4[\"Tool<br/>a Python function the host registered, run in the host process<br/>with the host's authority (spec 170)\"]\n  table --> k5[\"MCP tool<br/>executed by a remote server, projected under /.vfs/mcp/server (spec 170)\"]\n  table --> k6[\"Skill<br/>a directory holding SKILL.md; read, never executed (spec 169a)\"]\n```\n\n## The picture: the pipe and the terminal\n\n```mermaid\nflowchart LR\n  p1[\"stage\"] -->|\"Rows: a frozen Result slice, op-tagged<br/>or Bytes: a buffer with a mime<br/>one shape per chunk, bounded queues (ADR 083)\"| p2[\"stage\"]\n  p2 -->|\"same shape passes untouched;<br/>rows render to plain text for a byte consumer;<br/>bytes become one row at /.vfs/run/call-id/stdout for a row consumer\"| p3[\"stage\"]\n  p3 --> term[\"terminal boundary<br/>display rendering, 32,768-character cap, the binary placeholder<br/>[binary path mime sizeB vN] (ADR 085)\"]\n  term --> wire[\"MCP wire: five content blocks, verbatim<br/>one TextContent first, then typed blocks in row order<br/>structuredContent = Result.to_payload() without bytes<br/>images inline within budget, else a ResourceLink vfs:///path\"]\n```\n\n## The picture: the views and the index\n\n```mermaid\nflowchart LR\n  vfs[\"/.vfs\"] --> trash[\"trash<br/>per mount, each backend (built)\"]\n  vfs --> bin[\"bin<br/>the union of everything callable, in index order (169a)\"]\n  vfs --> skills[\"skills<br/>the union of every skill directory on the skill index (169a)\"]\n  vfs --> run[\"run/call-id<br/>stdout rows and a status record per program run (169c)\"]\n  vfs --> tools[\"tools<br/>host-registered functions: manifest and schema as content (170)\"]\n  vfs --> mcp[\"mcp/server/{tools, resources, prompts}<br/>each connected server projected by declared shape (170)\"]\n  vfs --> reserved[\"sessions, jobs<br/>reserved, unserved\"]\n  bin -.->|\"the index: directories the host registers, in order<br/>default /opt/bin, created at posture read; install needs add\"| opt[\"/opt/bin/*.wasm\"]\n```\n\n## The picture: the Python guest over vfs\n\n```mermaid\nflowchart LR\n  guest[\"wasi-python guest<br/>CPython 3.14 or 3.15 (ADR 086 pin 2, a lean) on wasm32-wasip1, numpy, pandas, scipy, matplotlib compiled in<br/>no threads, no network, no dlopen\"] -->|\"file calls: open, read, write, readdir ...<br/>staged whole at open, handed back whole at close\"| mount[\"Mount(VfsProvider(session), '/')<br/>wasi-python's mount protocol over one vfs Session<br/>every call carries the caller's Authority; /.vfs hidden\"]\n  guest -->|\"host::call with opaque JSON frames<br/>the tool protocol: list and call\"| door[\"the verb door<br/>vfs verbs bound to the caller's authority, Result wire frames\"]\n  mount --> session[\"vfs Session(authority)\"]\n  door --> session\n  session --> gate[\"THE GATE\"]\n  runner[\"wasi-python's runner: run, run_async, Session<br/>wasmtime, fuel, deadline, memory, output and call budgets\"] --> guest\n```\n\n## Reading the picture\n\nThe shell is a front. It owns a parser, a program table, a pipeline\nrunner and a terminal rendering. It owns no stored fact and no\npermission check. Every verb a command resolves to re-enters the\npublic router method, so the gate fires exactly as it would for a\nPython caller. That is the execution policy: the gate order is the\npolicy, and executing a stored program is `read` on its entry\n(ADR 084).\n\nOne name can be served by several kinds over time. `grep` is a verb\nbuiltin today; `sed` is a Rust text kernel; a wasm program is bytes\ninstalled under `/opt/bin`; `python3` is the wasi-python wheel's own\nrunner behind a thin `python` kind; a host's function is a tool; a\nremote server's tool is an MCP tool. The kind is invisible on the pipe. A\nprogram cannot hold more than its caller: its filesystem capability is\nthe verb set closed over the caller's `Authority`, and there is no\nparameter through which to widen it.\n\nThe pipe carries rows or bytes, one shape per chunk, and converts only\nat a seam. `ls | grep auth` filters rendered lines exactly as bash\ndoes. A single binary read crosses a pipe raw, like Unix, and prints a\nplaceholder at the terminal, never base64. On the MCP wire the result\nis MCP's five content blocks and nothing else.\n\n`/.vfs` grows from one view (the trash) to a catalogue: everything\ncallable under `bin`, the host's tools, connected MCP servers, skills,\nand the records of program runs. The catalogue views are router-owned\nand read-only. Installing a program is a `write` into an indexed\ndirectory under the ladder.\n\nThe Python runtime is a separate project, `wasi_python`, consumed as a\nwheel. Its 0.1.0 release already ships the two seams vfs needs: a\nmount protocol that makes a `Session` the guest's whole filesystem, and\na tool protocol through which guest code calls vfs verbs. Both carry\nthe caller's `Authority`. vfs's remaining work is bookkeeping: an errno\ntable, `move`'s replace rule, and the `python` program kind.\n\n## Terms this diagram introduces\n\n| Term | Meaning |\n|---|---|\n| **cli** | The meta-verb that takes a command string or argv and runs it through the shell. The one programmatic execution door. Refuses the system actor. |\n| **Program** | Anything callable by name from the shell: one ABI, six kinds. |\n| **ABI** | The one shape every program implements: `args`, `env`, `cwd`, `stdin`, `stdout`, `stderr`, `fs`, `budget` in; `stdout`, `stderr`, an exit code out. |\n| **Filesystem capability (`fs`)** | The vfs verb set curried with the caller's `Authority`. No authority parameter, no grant verbs, absolute paths only. |\n| **Verb builtin** | A program written as shell code over vfs verbs. |\n| **Text kernel** | A program whose core is bytes-to-bytes Rust in `vfs-core`, with a thin Python layer for operands. |\n| **Forms** | A program's declared option grammar and the subset this kind implements; an unimplemented form refuses `unsupported.form`. |\n| **Pipe, chunk** | One ordered stream per seam; each chunk is `Rows` or `Bytes`, never both. |\n| **Placeholder** | The one-line stand-in a binary row prints at a text boundary: `[binary <path> <mime> <size>B v<version>]`. |\n| **Render cap** | 32,768 characters at the `cli` display and the MCP adapter; a pipe is never capped. |\n| **View** | A `/.vfs` head the router serves from its own table: `bin`, `skills`, `run`, `tools`, `mcp`. |\n| **Index** | The ordered list of directories whose entries feed `/.vfs/bin`. Default `/opt/bin`. |\n| **Execution policy** | The gate order, fired on every verb a command resolves to. Executing a program is `read` on its entry. No `ask` inside vfs. |\n| **Budget** | A declared constant with a classified outcome: stages, argv bytes, fan-out, stdout bytes, wall time, fuel, verb calls, memory, staging bytes. |\n| **Five blocks** | MCP's content block types, the only wire: text, image, audio, resource link, embedded resource. |\n| **Mount protocol, tool protocol** | wasi-python's two embedder seams: serve the guest's filesystem; let guest code call host functions. |\n| **Verb door** | The host function behind `host::call` that carries vfs verb calls as `Result` wire frames. |\n\n## Landing order (as the specs stand on 2026-10-24)\n\n1. Spec 167 slices A to E: the renderer gaps, the parser, the pipe and\n   `cli`, the program forms, the harness. `run` and `SupportsRun`\n   retire in slice A.\n2. Spec 168: the text kernels in Rust.\n3. Spec 169a: the views and the index; 169b: generic wasm programs\n   (narrowed by the 2026-10-23 memo); 169c: `/.vfs/run`.\n4. Spec 171: the MCP adapter and `serve()`.\n5. Spec 170: tools and MCP servers as views (one small study still\n   owed).\n6. Spec 172: the `python` kind over wasi-python; QuickJS for\n   JavaScript.\n\n## Open\n\n- Spec 170 needs one small study before it is shaped.\n- ADR 086 pins 2, 5 and 8 are leans pending Clay.\n- `serve()`'s refusal to start on an open mount is not yet built\n  (`docs/explanation/open-in-process-loud-at-the-edge.md`).\n"}, {"id": "glossary", "file": "glossary.md", "title": "Glossary", "markdown": "# Glossary\n\nEvery term the architecture pages define, in alphabetical order. Each\nentry is one or two sentences and names the page that draws the term\nin context (a number in brackets). A term marked *planned* names\ndesigned behaviour not yet in code, with the spec that lands it. The\nidentity terms agree with `docs/reference/glossary.md`, which is the\npublic reference; this list is wider because it covers the whole\nsystem.\n\n**ABI.** The one shape every shell program implements: `args`, `env`,\n`cwd`, `stdin`, `stdout`, `stderr`, `fs`, `budget` in; `stdout`,\n`stderr` and an exit code out. *Planned, spec 167.* [11]\n\n**Access path.** The ordered list of statements one verb issues, with\nthe table each touches; pinned per verb as a test that counts\nstatements, rows and bytes. *Planned, spec 179.* [07]\n\n**Actor.** The one principal doing the work in a call. Recorded on every\nversion row. Differs from the subjects when an agent works for people.\n[09]\n\n**Admitted authority.** The authority a call runs as after the router's\n`_admitted` step: the explicit one, else the filesystem's default, else\nanonymous. Storage always receives one. [04]\n\n**Anonymous principal.** The principal `anon`, kind `anonymous`: what a\ncall runs as when nothing names an authority and there is no default.\nHolds only the everyone level; owns nothing; never joins a subject set.\n[09]\n\n**Arbitration.** How two creates of the same path are settled inside\none write transaction: an upsert where the dialect has one, else catch\nthe unique violation and retry. A `DialectProfile` field. [07]\n\n**Atomic unit.** The largest piece of work that commits whole or not at\nall: one call on one mount. [10]\n\n**Authority.** The frozen value every call carries: subjects, actor,\nprovenance, narrowing, source identity. Built only through the four\ndoors (`of`, `on_behalf_of`, `system`, `anonymous`). [09]\n\n**Binding.** One mount-table row: `(path, storage, meta)`. The root's own\nstorage is the identity binding at `/`. [04, 05]\n\n**Block, summary (lexical index).** The lexical index stores up to\n`BLOCK_SIZE` postings per `(term, block)` row and one summary row per\nterm that bounds every block, so a second round can skip blocks that\ncannot change the top-k. [08]\n\n**Body.** An entry's content: text in `vfs_content` or bytes in\n`vfs_blobs`, never both; `source` on the entry row says which. [06]\n\n**Budget (shell).** A declared constant with a classified outcome:\nstages per line, argv bytes, fan-out paths, stdout bytes, wall time,\nfuel, verb calls, memory, staging bytes. *Planned, ADR 084.* [11]\n\n**Busy guard.** The router's refusal of a delete, restore, sweep, move\nor copy that targets a live mount point or a region holding one;\nunmount first. `EBUSY`. [05]\n\n**Candidate (grep).** An entry the gram index nominates for a pattern.\nMay be a false positive; never a false negative; the matcher decides.\n[08]\n\n**Capability.** An operation a backend declares in `capabilities()`.\n\"Which verbs.\" A mount's effective set is the declared set minus the\nmounter's `deny_ops`. [02]\n\n**Capability-pruned.** A fan-out skips a binding that does not declare\nthe verb and adds a skip error instead of failing the call. [05]\n\n**Chunk.** One indexed unit of a body, split by tree-sitter spans for\ncode and markup or by the recursive splitter; entry-scoped, keyed\n`(entry_id, chunk_index)`. The unit the lexical index and the embedding\ndescribe. [06, 08]\n\n**cli.** The meta-verb that takes a command string or argv and runs it\nthrough the shell; the one programmatic execution door. Refuses the\nsystem actor. *Planned, spec 167.* [11]\n\n**Conflict redrive.** On a guard miss a verb classifies `conflict` and\nruns again from a fresh snapshot, within a retry budget with jittered\nwaits (ADR 025). [07, 10]\n\n**Derive.** The kernel serves an operation a backend lacks from simpler\ncalls the backend has: `tree` from `ls`, `copy` from `read` plus\n`write`. Correct, slower. *Planned, spec 179.* [02]\n\n**Derived verb.** A verb built from kernel calls that stores no fact of\nits own: `tree`, `edit`, `rmdir`. [02]\n\n**DialectProfile.** The per-engine policy record in `dialects.py` for\ndecisions SQLAlchemy takes no position on: the `IN`-list cap,\narbitration mode, isolation pins, lock hints, membership form, the\nvector distance function. Unknown engines resolve to the generic floor.\n[01, 07]\n\n**Dirty flag.** `chunked`, `encoded`, `indexable` on the entry row:\nwhether the chunks, the gram and lexical postings, and gram eligibility\nreflect the current body. A write clears them; `reindex` sets them. [06]\n\n**Dispatch class.** How a verb is routed and gated: `MUTATING_OPS`,\n`TWO_PATH_OPS`, `READ_OPS`, `EXEC_OPS`, `GRANT_OPS` in `ops.py`\n(`DEVELOPER_OPS` is a plane marker beside them, not a class). A\ndifferent axis from the kernel group. [02]\n\n**Domain model.** A pydantic value never bound to a database session:\n`Entry`, `Observation`, `Chunk`, `Version`, `Edge`. [03]\n\n**Door.** One of the four class methods that construct an `Authority`.\nThe bare constructor is not a door. [09]\n\n**Edge.** A typed relation between two entries, keyed `(source_id,\ntarget_id, edge_type)`, in `vfs_edges`. Caller-authored by `mkedge`,\nminted as `links` from markdown references, or the reserved `fs`\nmirror of the hierarchy. [06, 08]\n\n**Embedding provider.** The seam `reindex` fills `chunks.embedding`\nthrough: `model_id`, `dimension`, request caps, embed one batch.\nStorage owns budgets and the loop. Providers: hashing floor, model2vec,\nOpenAI, LangChain. [08]\n\n**encoded.** The entry flag meaning \"this row's postings are in the\ncurrent epoch\". False means `grep` scans the row. [08]\n\n**Entry.** The stored record of one file or directory; the durable\nshape. A pure pydantic value. [06]\n\n**entry_id.** The 26-character ULID on every entry row: the permanent\nlogical identity and the referential key every dependent table uses.\nMinted once, never reused, kept across a move. *Planned:* exposed\nread-only on `stat` (spec 181). [06]\n\n**Entry-scoped metadata.** Chunks, versions, edges: rows that belong to\na file and are addressed by file plus discriminator, never by a path.\n[06]\n\n**Epoch.** One built generation of the gram and lexical indexes. Built\ninvisible under a fresh number, published by one pointer flip in\n`vfs_meta`, reclaimed when dead. [06, 08]\n\n**Everyone level.** `everyone_level` on the entry row: the rank of the\ndeepest covering posture row. Derived, stamped at mint, rewritten by a\nrelabel. Lets a partial caller's read be one index seek. [06, 09]\n\n**Execution policy.** The gate order (capability, grammar, permission),\nfired on every verb a command resolves to. Executing a stored program is\n`read` on its entry. No `ask` inside vfs. *Planned, ADR 084.* [11]\n\n**Facet.** Anything built on top of kernel calls that stores no fact of\nits own: a front or a derived verb (ADR 087). [02]\n\n**Fail-partial.** How engines fail in practice: timeouts, deadlocks,\nlost serialization races, dropped connections, not a clean stop. The\nretry classes and the conflict redrive are the response. [10]\n\n**Fan-out.** Dispatching one scoped verb (`glob`, `grep`, `glean`) to\nevery binding its scope reaches, in parallel, and merging the answers.\n[05]\n\n**Fault model.** Which layer catches which fault: the engine owns media\nfaults and atomic commit; vfs owns logical faults and partial failures\nabove it, with `content_hash` as the detector (ADR 087 pin 8). [10]\n\n**Feature.** An argument family or an index a backend serves itself,\ndeclared in `features()`. \"Which arguments.\" *Planned, spec 179.* [02]\n\n**Filesystem capability (`fs`).** The vfs verb set curried with the\ncaller's `Authority`, handed to a shell program. No authority\nparameter, no grant verbs, absolute paths only. *Planned, ADR 082.* [11]\n\n**Five blocks.** MCP's content block types, the only wire format: text,\nimage, audio, resource link, embedded resource. *Planned, ADR 085.* [11]\n\n**Forms.** A shell program's declared option grammar and the subset this\nkind implements. *Planned, ADR 082.* [11]\n\n**Front.** A way into vfs built on top of the kernel: the Python API and\n`Session` (built); the MCP server, the shell, the WASI mount\n(planned). Adds its own machinery, stores no fact. [01, 02]\n\n**Frontier walk.** `graph`'s algorithm: the application holds the\nfrontier and the visited set; each hop is one chunked statement; every\nrow is judged against the caller's view. [08]\n\n**fs mirror edge.** One reserved-type `fs` edge row per non-root entry,\nparent to child, maintained in the write transaction. `parent_id` is\nauthoritative; the mirror serves the graph verb. [07]\n\n**Funnel.** `_dispatch_entry` and `_call_storage` in `base.py`: the one\nseam from op to storage and one seam back. [04]\n\n**Fusion, Ranker.** How a mount combines `glean`'s legs: a `Convex`\nweighting declared on the `Ranker` at construction, never per call.\n[08]\n\n**Garbage, gauge.** Tombstoned rows, version rows and bytes per mount;\na cheap read a deployment job consults before it cleans. *Planned,\nspec 180.* [10]\n\n**Gate.** The one funnel every call passes, with two halves. The\nrouter's half: parameters, routing, capability, reserved grammar,\nstructural permission maps. Storage's half: the caller's grants judged\ninside each SQL statement. [01, 04]\n\n**Generic floor.** The conservative `DialectProfile` an unknown SQL\nengine resolves to. Serves the core verbs; withholds `glean` and\n`graph`, which need a cosine distance function (ADR 059). [01]\n\n**Gram, trigram.** Three consecutive bytes of a folded body, packed into\n24 bits. The key of the gram index behind `grep`. [08]\n\n**Grant.** A row: a principal holds a rung at and below a path prefix.\nAdditive; there are no deny rows. Written by `grant`, removed by\n`revoke`, listed by `grants`. [09]\n\n**Grant revision.** `vfs_meta.grant_revision`: advanced as the first\nstatement of every grants write so rival admin writes serialise. Stamps\nversion rows and grant rows. [09]\n\n**Group.** A principal id starting with `group:`. A member holds every\ngrant its groups hold, nested up to eight levels. Membership is written\nby the system actor. [09]\n\n**Guarded update, guarded claim.** An `UPDATE` whose `WHERE` proves the\nrow still has the entry id, version and path the plan read (a claim\nproves the judged version). A rowcount miss means a rival moved first.\n[07, 10]\n\n**Hidden row.** A row the caller holds no rung on. Answers `not_found`\nexactly as a missing path does; never counted in search statistics.\n[09]\n\n**Identity binding.** The root binding at `/`: the node's own storage and\nthe fallback for every path no deeper binding claims. [05]\n\n**Index (shell).** The ordered list of directories whose entries feed\n`/.vfs/bin`; default `/opt/bin`. *Planned, ADR 082.* [11]\n\n**Intersection law.** A subject set holds a right only when every member\ndoes; the set's coverage is the meet of the members' coverage (ADR 066).\n[09]\n\n**Kernel.** The gate and everything under it: the router's funnel, the\nkernel operations, the storage seam, storage and the Rust engine\n(ADR 087). [01, 02]\n\n**Kernel group.** One of four kinds of kernel operation: filesystem core\n(`stat`, `ls`, `read`, `write`, `mkdir`, `delete`, `move`, `copy`),\nquery (`glob`, `grep`, `glean`, `graph`, `mkedge`, `rmedge`), history\n(`restore`, `sweep`), rights (`grant`, `revoke`, `grants`, `posture`,\n`add_member`, `remove_member`). Spec 181's `OpGroup` adds a fifth\nvalue, `derived`, for `tree` and `edit`. [02]\n\n**Ladder, rung.** The total order `none < list < read < add <\ncontribute < read_write`. `list` names a row; `read` shows it whole;\n`add` creates beneath and alters only one's own; `contribute` also\nedits anyone's but trashes only one's own; `read_write` does everything.\nEvery verb's rung is one row in `VERB_RUNGS` (ADR 080). [09]\n\n**Lease (reindex).** `vfs_meta.reindex_holder` plus a heartbeat: one\n`reindex` per mount at a time; a rival refuses `conflict`. [08]\n\n**Leg.** One ranked source inside `glean`: the lexical leg or the vector\nleg, each aggregated to entries and normalised to the unit interval.\n[08]\n\n**Lexical index, BM25.** The ranked text index: per-term blocks of\npostings with term frequencies and lengths, plus summary rows that\nbound every block; built under the gram epoch; scored in the Rust\nengine. [08]\n\n**links edge.** An edge minted from a markdown reference in a body,\nresolved against the live tree during the chunk pass. [08]\n\n**Longest-prefix resolution.** Finding the deepest binding whose path\nprefixes the caller's path. Every path resolves to exactly one backend.\n[05]\n\n**Matcher.** `ContentMatcher`, the Rust `verify` kernel's class: the one\ndefinition of a grep match for every surface (`count_lines`,\n`hit_lines`). [08]\n\n**Membership budget.** The tighter of the dialect's parameter budget and\nits `IN`-list cap; every `IN (...)` chunks to it, so no statement grows\nwith batch size. [07]\n\n**Mount.** One storage backend bound at one path in the namespace. [01,\n05]\n\n**Mount coordinates.** Paths as a storage sees them, relative to its\nbinding. Router (namespace) coordinates are paths as the caller sees\nthem. [05]\n\n**Mount point.** A directory row stored in the parent's storage at which\na binding attaches another storage. [05]\n\n**Mount protocol, tool protocol.** wasi-python's two embedder seams:\nserve the guest's whole filesystem; let guest code call host functions.\n*Planned use, spec 172.* [11]\n\n**Mount table.** The router's sorted map from path to `Binding`. [05]\n\n**Namespace.** The one rooted tree. Everything first-class is addressable\nin it by an absolute canonical path. [05]\n\n**Narrowing.** What a session has voluntarily given up, on top of what\ngrants deny. Today one value, `NONE`. A session can narrow and never\nwiden (ADR 063). *Further values planned, spec 148.* [09]\n\n**Needs.** A verb's rungs: on its target (`primary`), on a fresh name it\nmints (`create`), on a row it only passes or reads (`traverse`). [09]\n\n**Observation.** One row an operation returned about an entry at the\nmoment it returned, with a `populated` mask. The one result row type\nfor every verb. [06]\n\n**Offload.** Running CPU-bound work on a worker thread so the event loop\nkeeps serving other callers: grep's verify stage, reindex's chunk and\nposting stages, renderers, large-body hashing. [03]\n\n**Overlay, scan side.** The dirty rows `grep` reads directly because the\nindex does not cover them. Always correct, slower. [08]\n\n**Owner floor.** A principal named in `owner_id` can always read and\nwrite that row regardless of grants. [09]\n\n**Ownership.** The `owner_id` column, set once at creation from the\nauthority. One subject owns what it makes; a set, the system actor\nwithout a declaration, and anonymous own nothing. [09]\n\n**Pack.** A `reindex` phase that rewrites cold version ranges into a\nsnapshot plus forward deltas. ADR 017's name. *Planned, spec 180.* [10]\n\n**Parameter budget.** `dialect.insertmanyvalues_max_parameters`: the\nbind-parameter cap SQLAlchemy models; bulk inserts chunk to it. [07]\n\n**Parent bump.** Ticking each touched parent's version in a write, with\na guard proving the parent still lives at its path. [07]\n\n**parent_id.** The one structural pointer: the parent's `entry_id`.\nAuthoritative for the hierarchy. [06]\n\n**Path.** The `Path` type in `paths.py`: normalised, validated, at most\n1,024 bytes, segments at most 255 bytes. [05]\n\n**Path segments.** One posting row per ancestor directory name of an\nentry, mirroring the `path` column at every commit, so `glob` can push\nliteral directory components into SQL. [07]\n\n**Permission layer, PermissionMap.** The router's structural layer per\nbinding: a default of `read` or `read_write` plus prefix overrides,\nbuilt by the `read_only()` and `read_write()` factories. Composes\ndownward and only tightens. Not per caller. [04, 09]\n\n**Persistence model.** The hand-written tables in `models/rows.py`, held\nin step with the domain models by a drift test. [03]\n\n**Pipe, chunk (shell).** One ordered stream per seam; each chunk is\n`Rows` (a frozen `Result` slice) or `Bytes` (a buffer with a mime),\nnever both. *Planned, ADR 083.* [11]\n\n**Placeholder.** The one-line stand-in a binary row prints at a text\nboundary: `[binary <path> <mime> <size>B v<version>]`. *Planned,\nADR 085.* [11]\n\n**Plan then execute.** The write family's discipline: fetch committed\nstate once, adjudicate the whole batch in memory, execute only an\nerror-free plan. [07]\n\n**Populated mask.** The set of field names a call fetched on an\n`Observation`. A null outside the mask means \"not fetched\"; inside it,\n\"fetched and null\". [06]\n\n**Posting list.** One gram's sorted list of entry ids, stored as a varint\ncount plus LEB128 deltas; decoded only in the Rust engine. [08]\n\n**Posture.** The everyone level at and below a prefix, stored as a grant\nrow for the reserved principal `*`. Deepest covering posture wins.\nDefault `read_write`. Named by the rung: `none`, `list`, `read`, `add`,\n`contribute`, `read_write`. [06, 09]\n\n**Preview.** The query-biased excerpt cut from a `glean` hit's chunk\ntext, bounded by construction, no second fetch. [08]\n\n**Principal.** One verified identity: `sub` (the token's subject claim),\na kind (`user`, `service`, `system`, `anonymous`), scopes. [09]\n\n**Program.** Anything callable by name from the shell: one ABI, six kinds\n(verb builtin, text program, program, tool, MCP tool, skill).\n*Planned, ADR 082.* [11]\n\n**Provenance.** How an authority was proven: `edge` (a verified token at\nthe transport boundary), `constructed` (trusted code in process),\n`system`. Recorded on every version row. [09]\n\n**Rebase.** Translating paths and errors between mount coordinates and\nrouter coordinates: `with_mount` and `without_mount` on `Result`. [04]\n\n**Redrive.** See *conflict redrive*. [10]\n\n**reindex.** The one maintenance verb: renderings, chunks, links, gram\nand lexical epochs, segments, edges, signals, embeddings; each phase in\nits own transaction under a lease. [08]\n\n**Relabel.** The resumable pass that rewrites `everyone_level` under a\nprefix after a posture change, in bounded chunks behind a cursor in\n`vfs_relabels`. [09]\n\n**Render cap.** 32,768 characters at the `cli` display and the MCP\nadapter; a pipe is never capped. *Planned, ADR 085.* [11]\n\n**Rendering.** The text derived from a bytes body by a per-format\nrenderer (pdf, docx, pptx, xlsx), stored in the content row and\nstamped on the entry with the bytes hash and the renderer's generation.\n[06]\n\n**Replay, request key.** Every mutating verb is safe to send twice or\nrecognisable on the second send; the two forms that cannot be take a\nkey answered from the stored first `Result`. *Planned, spec 177.* [10]\n\n**Rerank.** The cross-mount merge of `glean` answers: one BM25 over the\nunion, each mount contributing a prefix of its own list; a mount's own\norder is never changed. [05]\n\n**Reserved scope.** `/.vfs`: the system's own tree, served as views,\nnever written by a caller. [05]\n\n**Result.** The envelope every verb returns: `ops`, `observations`,\n`errors`, extras. `success` is derived from the errors, never stored.\nSupports set algebra, sort, top, filter, rebase, wire payloads. [06]\n\n**ResultError.** One classified error fact: a kind from the closed\nvocabulary, a message composed from the kind's phrase, a severity, a\npath. No producer writes prose (ADR 076). [06]\n\n**Resumable.** The atomicity model where a call commits in bounded\nchunks behind a durable mark and the next call finishes the work:\nrelabel, render, embed, `pack`, bounded `sweep`. [10]\n\n**Revive.** A write at a tombstoned path: the same `entry_id` comes back\nlive and the old body is kept as a version. [10]\n\n**Rights.** The compiled result for one caller at one rung: level,\nspans, owner arms, roots, holes. Pure, in `storage/grants.py`. [09]\n\n**RightsCache.** The per-mount cache of compiles, keyed on the greatest\n`principal_revisions` stamp over the caller's subjects and groups plus\nthe relabel marks in flight. A grant write retires its grantee's\ncompile. [09]\n\n**Road directory.** A hidden directory with a visible row beneath it:\nlisted as a bare name; refuses every write beneath it. [09]\n\n**Router.** `VirtualFileSystem` in `base.py`: the mount table, the gate,\nthe funnel, fan-out. One router is one namespace and one policy layer.\n[03]\n\n**Rust engine, Rust kernel.** The compiled crate `crates/vfs-core`,\nbuilt into the wheel as `vfs._native` (required, ADR 057). Exported\nkernels: `distinct_gram_count`, `PostingsBuilder`, `candidate_ids`,\n`ContentMatcher`, `chunk_spans`, `markdown_refs`, `tokenize`,\n`LexicalBuilder`, `lexical_score`, `decode_summary`, `select_blocks`,\n`vector_topk`, `centrality_prior`; `cosine_topk` and `Chunk.split_batch`\nare Python wrappers over `vector_topk` and `chunk_spans`. [01, 08]\n\n**Schema format.** The integer in `vfs_meta.schema_format_version`,\nbumped on every schema change; a mount at an old format is refused at\nfirst touch, never migrated silently (ADR 020). 23 today. [06]\n\n**Scrub.** A paced, report-only read of everything, version rows\nincluded, comparing bodies to their hashes. *Planned, spec 175.* [10]\n\n**Seam.** A declared boundary with a protocol on one side and replaceable\nimplementations on the other: the storage seam, the embedding seam, the\nrenderer seam, the native seam. Also, in tests, a named point where a\nrival writer is staged (`seams.py`). [03]\n\n**Serialization point.** The one row of `vfs_lock`, locked by a\nserialized verb's first statement. Nothing else reads it. [06, 10]\n\n**Serialized verb.** `move`, `copy`, `delete`, `restore`, `sweep`: a verb\nthat rewrites or hides parts of the tree other rows depend on, so it\ntakes the serialization point first and never interleaves with another.\n[10]\n\n**Session.** A facade holding one authority and one filesystem. Every\nverb on it is the filesystem verb with the authority filled in. Closed\nis final. [03]\n\n**Shadow filter.** Dropping rows that a deeper binding owns, so a\nlisting never shows the parent storage's stale row under a mount point.\n[04]\n\n**Signal, prior.** A query-independent importance score per entry in\n`[0, 1]`, computed during `reindex` from the reference graph and the\ntree (centrality, smoothed), stored under a generation, read on the\nquery path. [08]\n\n**Snapshot, delta (versions).** A version row holding the whole body,\nor (planned, spec 180) a forward diff from the previous one. [10]\n\n**Source identity.** The raw edge identity behind an authority (an\nissuer and subject pair), set once at the edge, stored on version rows,\nnever interpreted. [09]\n\n**Storage seam.** The protocol in `storage/protocol.py` the router's\nfunnel calls: the `Supports*` families and `StorageBackend`. [01, 02]\n\n**Sub.** A principal's name: the JWT and OpenID Connect claim for\n\"subject\", kept unchanged from the token into every column that names\na principal. [09]\n\n**Subjects.** The set of principals whose permissions apply to a call.\nNon-empty except under the system actor; at most 64. [09]\n\n**Sweep.** The one destroying verb: tombstoned rows, their bodies,\nversions, chunks and edges. Developer plane. *Planned:* a limit and a\nresumption key (spec 180). [10]\n\n**System actor.** `Authority.system()`: no subjects, bypasses grants,\nstamps whatever owner a payload declares. Mount administration runs as\nit. Refused on the wire. [09]\n\n**Text kernel.** A shell program whose core is bytes-to-bytes Rust in\n`vfs-core` with a thin Python layer for operands: `sed`, `awk`, `cut`,\n`sort`, `wc`, `diff`. *Planned, spec 168.* [11]\n\n**Three-seek predicate.** The visibility clause storage compiles into a\nread: the everyone level on the row, the caller's grant ranges joined\nto the path index, the rows the caller owns; three index seeks merged\nby `UNION ALL`. The statement text never changes with the number of\ngrants (ADRs 067, 072). [04, 09]\n\n**Tombstone.** `deleted_at` and `trash_root_id` set on a row in place.\nA delete sets it; a restore clears it; the row keeps its path (ADR 074).\n[06, 10]\n\n**Trait.** A quality of how a backend serves, from `traits()`: today\nthe grep tier, the glean staleness, the arbitration mode; a durability\ntier is planned (spec 179). \"How.\" [02]\n\n**Trash root.** The row a delete named; every row in its subtree carries\nits id, so `restore` clears a root's set in one statement. [10]\n\n**Trash view.** `/.vfs/trash/<path>`: the tombstoned row at `<path>`,\nper mount. The one `/.vfs` view built today. [05]\n\n**Trust tier.** Where the gate is a wall and where it is a convention:\nin process (a convention, open by default), on the wire (a wall: a\ntoken in, an `Authority` out), in the guest (a wall: file calls and the\nhost door only). ADR 087 pin 5. [04]\n\n**Unauthenticated.** The mount-side refusal of an anonymous call at a\npath whose posture is below the verb's rung. The hint names the fix.\n[09]\n\n**Verb builtin.** A shell program written as shell code over vfs verbs.\n*Planned, spec 167.* [11]\n\n**Verb door.** The host function behind wasi-python's `host::call` that\ncarries vfs verb calls as `Result` wire frames. *Planned, spec 172.*\n[11]\n\n**Version.** A file's per-entry revision counter, bumped on every\nmaterial change; also the number on a version row. [10]\n\n**Version mint.** Writing the replaced body as a version row with the\nreplacing authority's attribution. Creates mint nothing; identical\nbodies mint nothing. [07]\n\n**Version row.** The replaced body kept whole, with actor, subjects,\nprovenance, source identity and grant revision. [06, 10]\n\n**View.** A `/.vfs` head the router serves from a table of its own,\nchecked before the mount table: `bin`, `skills`, `run`, `tools`, `mcp`.\n*Planned, specs 169 and 170.* [05, 11]\n\n**Visibility.** Storage's compile of what one read call may see at the\nverb's rung: which rows the caller may name, which it may read whole.\n[04, 09]\n\n**Whole-batch.** The atomicity model where the whole call on one mount\nis one transaction: the write family, the topology verbs, the trash\nverbs, the edge verbs, the grant writes. [07, 10]\n\n**WriteGate.** Storage's point check before a mutation's first write\nstatement: the caller's rung on every target and ancestor, decided once\nper batch; any refusal fails the batch whole. [04, 09]\n\n**WritePlan, StagedEntry.** The in-memory write plan and one path's\nplanned final state, carrying the persistence bookkeeping an `Entry`\nnever holds. [07]\n\n## Deliberately not in vfs\n\nEach with the recorded reason (ADR 087 pin 4; the OSTEP memo §3).\n\n| Not in vfs | Reason |\n|---|---|\n| File descriptors, an open-file table, `seek`, `close` | Per-process state; a descriptor is checked once and vfs checks every call; fronts own their own handle tables. |\n| `fsync` as a verb | Every verb commits before it returns; durability is a trait. |\n| Hard links, symlinks, a link count | One path per entry is the grant coordinate; `..` resolves by text; edges key on `entry_id` and survive moves. |\n| Mode bits, `chmod` | Rights are per caller on the row and in grant rows; a FUSE front computes `st_mode` from the caller's rung. |\n| An access time | A read never writes. |\n| Inode-keyed addressing | `entry_id` is read-only on `stat`; rights and routing stay keyed by path. |\n| A journal of vfs's own | The engine's log does this; identities are never reused. |\n| Server-pushed invalidation | A model cannot be called back; validate at write time (`edit`'s match, `if_version=`). |\n| Cross-mount transactions | Per-mount atomicity is the ceiling; a designed entry point if ever wanted. |\n| An `ask` or policy language inside vfs | vfs allows or classifies; a host adds its own human-in-the-loop layer. |\n"}], "build": {"date": "2026-10-27", "commit": "ba77449"}}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

const $ = (sel, root = document) => root.querySelector(sel);
const DATA = JSON.parse($("#pages-data").textContent);
const PAGES = DATA.pages;
const BY_ID = new Map(PAGES.map((p) => [p.id, p]));

const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------------------------------------------------------------------
// Theme: follows the system until the button is pressed, then remembers.
// ---------------------------------------------------------------------------
function currentTheme() {
  const pinned = document.documentElement.dataset.theme;
  if (pinned) return pinned;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
try {
  const saved = localStorage.getItem("vfs-arch-theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch {}

function initMermaid() {
  mermaid.initialize({
    startOnLoad: false,
    theme: currentTheme() === "dark" ? "dark" : "default",
    themeVariables: { fontFamily: 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', fontSize: "14px" },
    flowchart: { useMaxWidth: false, htmlLabels: true, curve: "basis" },
    sequence: { useMaxWidth: false },
    class: { useMaxWidth: false },
    state: { useMaxWidth: false },
  });
}

$("#theme").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("vfs-arch-theme", next); } catch {}
  initMermaid();
  renderPage(current, true);
});

// ---------------------------------------------------------------------------
// Markdown: headings get ids, .md links become in-app routes, mermaid blocks
// become diagram placeholders that are drawn after the HTML is in place.
// ---------------------------------------------------------------------------
const slugger = {
  seen: new Map(),
  reset() { this.seen.clear(); },
  slug(html) {
    const base = html.replace(/<[^>]+>/g, "").toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
    const n = this.seen.get(base) || 0;
    this.seen.set(base, n + 1);
    return n ? `${base}-${n}` : base;
  },
};
let current = null;

marked.use({
  gfm: true,
  renderer: {
    heading({ tokens, depth }) {
      const text = this.parser.parseInline(tokens);
      const id = slugger.slug(text);
      const anchor = depth > 1 ? `<a class="anchor" href="#${current}/${id}" aria-label="Link to this section">#</a>` : "";
      return `<h${depth} id="${id}">${anchor}${text}</h${depth}>\n`;
    },
    link({ href, title, tokens }) {
      const text = this.parser.parseInline(tokens);
      const m = href.match(/^([\w.-]+)\.md(?:#(.*))?$/);
      let target = href;
      if (m && BY_ID.has(m[1])) target = `#${m[1]}${m[2] ? "/" + m[2] : ""}`;
      const extra = /^https?:/.test(target) ? ' target="_blank" rel="noopener"' : "";
      const t = title ? ` title="${escapeHtml(title)}"` : "";
      return `<a href="${escapeHtml(target)}"${t}${extra}>${text}</a>`;
    },
    code({ text, lang }) {
      if (lang === "mermaid") return `<figure class="diagram" data-source="${escapeHtml(text)}"></figure>\n`;
      return `<pre><code class="lang-${escapeHtml(lang || "")}">${escapeHtml(text)}</code></pre>\n`;
    },
  },
});

// ---------------------------------------------------------------------------
// Diagrams: each mermaid block is drawn once, then wrapped in a pan/zoom stage.
// ---------------------------------------------------------------------------
let viewers = [];
let seq = 0;

async function drawDiagrams(root) {
  viewers = [];
  for (const fig of root.querySelectorAll("figure.diagram")) {
    const source = fig.dataset.source;
    const id = `diagram-${++seq}`;
    try {
      const { svg } = await mermaid.render(id, source);
      viewers.push(mountViewer(fig, svg, source));
    } catch (err) {
      document.getElementById(id)?.remove();
      fig.innerHTML = `<pre class="diagram-error">This block did not render:\n${escapeHtml(String(err?.message || err))}</pre><pre><code>${escapeHtml(source)}</code></pre>`;
    }
  }
}

function mountViewer(fig, svgText, source) {
  fig.innerHTML = `
    <div class="toolbar">
      <button data-act="out" title="Zoom out">−</button>
      <span class="zoom-level">100%</span>
      <button data-act="in" title="Zoom in">+</button>
      <button data-act="fit" title="Fit the whole diagram">Fit</button>
      <button data-act="one" title="Actual size">1:1</button>
      <button data-act="full" title="Full screen (Esc to leave)">Full screen</button>
      <span class="spacer"></span>
      <span class="hint">Drag to pan · pinch or ⌃ wheel to zoom · double-click to fit</span>
    </div>
    <div class="stage"><div class="layer"></div></div>
    <details><summary>Mermaid source</summary><pre><code></code></pre></details>`;
  $("details code", fig).textContent = source;
  const stage = $(".stage", fig);
  const layer = $(".layer", fig);
  const level = $(".zoom-level", fig);
  layer.innerHTML = svgText;
  const svg = $("svg", layer);
  const vb = svg.viewBox.baseVal;
  const W = vb && vb.width ? vb.width : parseFloat(svg.getAttribute("width")) || 800;
  const H = vb && vb.height ? vb.height : parseFloat(svg.getAttribute("height")) || 400;
  svg.style.maxWidth = "none";
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);

  const PAD = 16;
  let s = 1, tx = 0, ty = 0;
  const clamp = (v) => Math.min(8, Math.max(0.05, v));
  const expanded = () => fig.classList.contains("expanded");

  function apply() {
    layer.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    level.textContent = `${Math.round(s * 100)}%`;
  }
  function sizeStage() {
    if (expanded()) { stage.style.height = ""; return; }
    const w = stage.clientWidth - PAD * 2;
    const fitW = Math.min(1, w / W);
    stage.style.height = `${Math.max(160, Math.min(H * fitW + PAD * 2, innerHeight * 0.72))}px`;
  }
  function center() {
    const r = stage.getBoundingClientRect();
    tx = (r.width - W * s) / 2;
    ty = (r.height - H * s) / 2;
  }
  function fit() {
    sizeStage();
    const r = stage.getBoundingClientRect();
    const best = Math.min((r.width - PAD * 2) / W, (r.height - PAD * 2) / H);
    s = expanded() ? best : Math.min(1, best);
    center();
    apply();
  }
  function zoomAt(cx, cy, factor) {
    const r = stage.getBoundingClientRect();
    const x = cx - r.left, y = cy - r.top;
    const ns = clamp(s * factor);
    tx = x - (x - tx) * (ns / s);
    ty = y - (y - ty) * (ns / s);
    s = ns;
    apply();
  }
  function zoomCenter(factor) {
    const r = stage.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
  }
  function setExpanded(on) {
    fig.classList.toggle("expanded", on);
    document.body.classList.toggle("locked", on);
    $('[data-act="full"]', fig).textContent = on ? "Exit full screen" : "Full screen";
    fit();
  }

  $(".toolbar", fig).addEventListener("click", (e) => {
    const act = e.target.closest("button")?.dataset.act;
    if (act === "in") zoomCenter(1.25);
    else if (act === "out") zoomCenter(1 / 1.25);
    else if (act === "fit") fit();
    else if (act === "one") { s = 1; center(); apply(); }
    else if (act === "full") setExpanded(!expanded());
  });
  stage.addEventListener("wheel", (e) => {
    if (!expanded() && !e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });
  stage.addEventListener("dblclick", fit);
  let drag = null;
  stage.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY };
    stage.classList.add("dragging");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", (e) => {
    if (!drag) return;
    tx += e.clientX - drag.x;
    ty += e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    apply();
  });
  const endDrag = () => { drag = null; stage.classList.remove("dragging"); };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  fit();
  return { fit, collapse: () => expanded() && setExpanded(false) };
}

addEventListener("keydown", (e) => { if (e.key === "Escape") viewers.forEach((v) => v.collapse()); });
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => viewers.forEach((v) => v.fit()), 120); });

// ---------------------------------------------------------------------------
// Navigation: the page list, the active page's outline, prev/next, routing.
// ---------------------------------------------------------------------------
function pageLabel(p) {
  const m = p.title.match(/^(\d+)\.\s*(.*)$/);
  return m ? `<span class="num">${m[1]}</span>${escapeHtml(m[2])}` : `<span class="num"></span>${escapeHtml(p.title)}`;
}

function buildNav(outlineFor) {
  const items = PAGES.map((p) => {
    const active = p.id === current;
    let outline = "";
    if (active && outlineFor) {
      const heads = [...outlineFor.querySelectorAll("h2")].map((h) => `<li><a href="#${p.id}/${h.id}">${escapeHtml(h.textContent.replace(/^#/, ""))}</a></li>`);
      if (heads.length) outline = `<ol class="outline">${heads.join("")}</ol>`;
    }
    return `<li class="${active ? "active" : ""}"><a href="#${p.id}">${pageLabel(p)}</a>${outline}</li>`;
  });
  $("#nav").innerHTML = `<h2>Pages</h2><ol>${items.join("")}</ol>`;
}

function pager(page) {
  const i = PAGES.indexOf(page);
  const link = (p, label) => (p ? `<a href="#${p.id}"><small>${label}</small>${escapeHtml(p.title)}</a>` : "<span></span>");
  return `<div class="pager">${link(PAGES[i - 1], "Previous")}${link(PAGES[i + 1], "Next")}</div>`;
}

async function renderPage(id, force = false) {
  const page = BY_ID.get(id) || PAGES[0];
  if (page.id === current && !force) return;
  current = page.id;
  slugger.reset();
  const main = $("#content");
  main.innerHTML = marked.parse(page.markdown) + pager(page);
  document.title = `${page.title} · vfs architecture`;
  $("#crumb").textContent = page.title;
  buildNav(main);
  await drawDiagrams(main);
}

async function route() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  const [pid, anchor] = raw.split("/");
  const samePage = pid === current;
  await renderPage(pid || PAGES[0].id);
  if (anchor) document.getElementById(anchor)?.scrollIntoView({ block: "start" });
  else if (!samePage) scrollTo(0, 0);
}

// Served over HTTP, read the .md files from disk so the view is never stale.
async function refreshFromDisk() {
  if (location.protocol === "file:") return false;
  const ok = await Promise.all(PAGES.map(async (p) => {
    try {
      const r = await fetch(p.file, { cache: "no-store" });
      if (!r.ok) return false;
      p.markdown = await r.text();
      return true;
    } catch { return false; }
  }));
  return ok.every(Boolean);
}

initMermaid();
const live = await refreshFromDisk();
const badge = $("#badge");
badge.textContent = live ? "live from the .md files" : `snapshot ${DATA.build.date} · ${DATA.build.commit}`;
badge.classList.toggle("live", live);
addEventListener("hashchange", route);
await route();
</script>

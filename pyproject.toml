[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

# Pendulum-model mixed layout: the complete pure-Python implementation under
# src/vfs ships in every wheel; the Rust engine rides beside it as vfs._native.
[tool.maturin]
python-source = "src"
module-name = "vfs._native"
manifest-path = "crates/vfs-core/Cargo.toml"
features = ["pyo3/extension-module", "python"]

[project]
name = "vfs-py"
version = "0.0.22"
description = "The agentic filesystem. Safe file operations, knowledge graphs, and semantic search — unified for AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Clay Gendron" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "unidiff>=0.7",
    "pyyaml>=6.0.3",
    "python-ulid>=3.1.0",
    "numpy>=2.4.2",
]

[project.urls]
Homepage = "https://github.com/ClayGendron/vfs"
Repository = "https://github.com/ClayGendron/vfs"
Issues = "https://github.com/ClayGendron/vfs/issues"

[project.optional-dependencies]
search = [
    "usearch>=2.0",
]
openai = ["openai>=1.0"]
pinecone = ["pinecone[asyncio]>=5.0"]
databricks = ["databricks-vectorsearch>=0.40"]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
mssql = ["aioodbc>=0.5", "pyodbc>=5.0"]
mysql = ["aiomysql>=0.2"]
oracle = ["oracledb>=2.0"]
deepagents = ["deepagents>=0.4"]
langchain = ["langchain-core>=0.3"]
langgraph = ["langchain-core>=0.3", "langgraph>=0.2"]
all = ["vfs-py[search,openai,pinecone,databricks,postgres,mssql,mysql,oracle,deepagents,langchain,langgraph]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ipykernel>=7.2.0",
    # typing-only: lets ty resolve the lazy pgvector import in models/vector.py
    "pgvector>=0.3",
    "ty>=0.0.60",
    "ruff>=0.15.22",
]
docs = [
    "mkdocs-material>=9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
    "PTH",    # flake8-use-pathlib
    "PERF",   # perflint
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ANN", "S101", "TC001"]
"src2/**/*.py" = ["ALL"]  # archived — skip linting
"tests2/**/*.py" = ["ALL"]  # archived — skip linting
"context/**/*.py" = ["ALL"]  # story spikes — throwaway benchmark code

[tool.ruff.lint.isort]
known-first-party = ["vfs"]

[tool.ty]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"
root = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["tests/fixtures/repos", "tests2", "src2"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "needs(*ops): ops a storage-conformance test requires the backend to declare",
    "postgres: conformance leg against a real PostgreSQL server (VFS_TEST_POSTGRES_URL)",
    "mysql: conformance leg against a real MySQL server (VFS_TEST_MYSQL_URL)",
    "mssql: conformance leg against a real SQL Server instance (VFS_TEST_MSSQL_URL)",
    "oracle: conformance leg against a real Oracle server (VFS_TEST_ORACLE_URL)",
]

[tool.coverage.run]
source = ["src/vfs"]
# SQLAlchemy's asyncio layer runs sync code inside greenlets; without
# greenlet tracing, coverage silently drops lines after switch points.
concurrency = ["greenlet", "thread"]
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

name: Dialect tests

# The real-engine conformance leg, on every Postgres version upstream supports. The servers
# come from docker/compose.test.yml — the same file used locally — so images,
# credentials, and health probes have one source of truth. It runs on a push
# to main and on PRs that touch storage; there is no schedule, so a run
# always traces back to a commit. Manual dispatch covers everything else.

on:
  push:
    branches: [main]
    paths:
      - "src/vfs/storage/**"
      - "src/vfs/models/**"
      - "tests/**"
      - "docker/compose.test.yml"
      - "pyproject.toml"
      - ".github/workflows/test-dialects.yml"
  pull_request:
    paths:
      - "src/vfs/storage/**"
      - "src/vfs/models/**"
      - "tests/**"
      - "docker/compose.test.yml"
      - "pyproject.toml"
      - ".github/workflows/test-dialects.yml"
  workflow_dispatch:

jobs:
  conformance:
    name: conformance (postgres ${{ matrix.version }})
    runs-on: ubuntu-24.04
    # A backstop for a hang: the slowest leg takes about 17 minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Each tested version is a compose service of its own, on its own port.
        include:
          - version: "15"
            service: postgres15
            port: "54315"
          - version: "16"
            service: postgres16
            port: "54316"
          - version: "17"
            service: postgres17
            port: "54317"
          - version: "18"
            service: postgres18
            port: "54318"
          - version: "19"
            service: postgres
            port: "54320"
    env:
      VFS_TEST_POSTGRES_URL: "postgresql+asyncpg://vfs:vfs@localhost:${{ matrix.port }}/vfs"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # Naming the service activates its profile; --wait blocks on the healthcheck, which probes query-readiness.
      - name: Start Postgres ${{ matrix.version }}
        run: docker compose -f docker/compose.test.yml up -d --wait --wait-timeout 300 ${{ matrix.service }}

      # The conformance contract renders real documents, so the document
      # libraries install beside the driver.
      - name: The shell module's target, which the extension's build compiles for
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        run: uv sync --extra postgres --extra documents --group dev

      # Container-healthy can precede login-ready; probe with the real driver
      # before handing pytest a server that refuses its first connection.
      - name: Probe SQL readiness
        run: |
          uv run python - "$VFS_TEST_POSTGRES_URL" <<'EOF'
          import asyncio, sys
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main(url: str) -> None:
              last: Exception | None = None
              for _ in range(60):
                  engine = create_async_engine(url)
                  try:
                      async with engine.connect() as conn:
                          await conn.execute(text("SELECT 1"))
                      return
                  except Exception as exc:
                      last = exc
                      await asyncio.sleep(2)
                  finally:
                      await engine.dispose()
              raise SystemExit(f"database never became ready: {last!r}")

          asyncio.run(main(sys.argv[1]))
          EOF

      - name: Conformance suite
        run: uv run pytest -m postgres --tb=short -n 0

      # A test past its deadline leaves every thread's stack there.
      - name: Upload the stacks of a hung test
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-hangs-postgres${{ matrix.version }}
          path: test-hangs/
          if-no-files-found: ignore

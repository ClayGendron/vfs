name: VFS App

on:
  push:
    branches: [main]
    paths:
      - "vfs-app/**"
      - ".github/workflows/vfs-app.yml"
  pull_request:
    paths:
      - "vfs-app/**"
      - ".github/workflows/vfs-app.yml"

concurrency:
  group: vfs-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vfs-app
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

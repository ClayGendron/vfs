[package]
name = "vfs-shell-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The shell's machine as a WebAssembly module: one entry, bytes in and out"
publish = false

[lib]
name = "shell_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
vfs-shell = { path = "../vfs-shell" }

[dev-dependencies]
wasmi = "2.0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"

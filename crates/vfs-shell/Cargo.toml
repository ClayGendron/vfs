[package]
name = "vfs-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A bash interpreter that does no IO: every effect is a request its host answers or refuses"
publish = false

[lib]
name = "shell"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"

[package]
name = "vfs-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The vfs engine: gram extraction and posting-list building, with an optional Python binding"

[lib]
name = "vfs_core"
crate-type = ["cdylib", "rlib"]

[features]
# The engine is binding-free by default; `python` adds the pyo3 module
# maturin embeds into the vfs-py wheel as `vfs._accel`.
python = ["dep:pyo3"]

[dependencies]
memchr = "2"
pyo3 = { version = "0.29", optional = true, features = ["abi3-py311"] }
rayon = "1"
regex = "1"
regex-syntax = "0.8"
tree-sitter = "0.26"

# Grammar crates for the chunk registry (chunk.rs), one shared runtime.
# Resolved 2026-08-25 against the language pack's reference set; names
# that need a maintained fork carry it here (kotlin-ng, md, sequel,
# svelte-ng, toml-ng); hcl serves both hcl and terraform; typescript
# serves both typescript and tsx.
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.4"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-cuda = "0.21.1"
tree-sitter-d = "0.8.2"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-erlang = "0.20.0"
tree-sitter-fish = "3.6.0"
tree-sitter-fsharp = "0.3.11"
tree-sitter-gleam = "1.0.0"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.2.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.23.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"

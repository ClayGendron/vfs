[package]
name = "vfs-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The vfs engine: gram extraction and posting-list building, with an optional Python binding"

[lib]
name = "vfs_core"
crate-type = ["cdylib", "rlib"]

[features]
# The engine is binding-free by default; `python` adds the pyo3 module
# maturin embeds into the vfs-py wheel as `vfs._accel`.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", optional = true, features = ["abi3-py311"] }
